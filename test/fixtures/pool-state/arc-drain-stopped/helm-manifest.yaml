# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: redducklabs-runners
  namespace: arc-runners
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.14.2
    app.kubernetes.io/name: redducklabs-runners
    app.kubernetes.io/instance: redducklabs-runners
    app.kubernetes.io/version: "0.14.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: redducklabs-runners
    actions.github.com/scale-set-namespace: arc-runners
  annotations:
    actions.github.com/values-hash: 100f28a242777b98f17219ba4782ecd6833712e79ec2c5f0b30722470fe5525
    actions.github.com/cleanup-github-secret-name: redducklabs-runners-gha-rs-github-secret
    actions.github.com/cleanup-manager-role-binding: redducklabs-runners-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: redducklabs-runners-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: redducklabs-runners-gha-rs-no-permission

spec:
  githubConfigUrl: https://github.com/redducklabs
  githubConfigSecret: redducklabs-runners-gha-rs-github-secret
  runnerGroup: redducklabs-private-runners
  runnerScaleSetName: redducklabs-runners
  maxRunners: 0
  minRunners: 0

  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      affinity: 
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - github-runners-pool-16g
      automountServiceAccountToken: 
        false
      imagePullSecrets: 
        - name: do-registry-secret
      nodeSelector: 
        node-type: github-runner
      resources: 
        limits:
          memory: 6Gi
        requests:
          cpu: "3"
          memory: 5Gi
      tolerations: 
        - effect: NoSchedule
          key: github-runner
          operator: Equal
          value: "true"
      restartPolicy: Never
      serviceAccountName: redducklabs-runners-gha-rs-no-permission
      initContainers:
      - args:
        - -r
        - /home/runner/externals/.
        - /home/runner/tmpDir/
        command:
        - cp
        image: registry.digitalocean.com/redducklabs/github-runner:latest
        name: init-dind-externals
        volumeMounts:
        - mountPath: /home/runner/tmpDir
          name: dind-externals
      - args:
        - dockerd
        - --host=unix:///var/run/docker.sock
        - --group=$(DOCKER_GROUP_GID)
        - --registry-mirror=https://mirror.gcr.io
        env:
        - name: DOCKER_GROUP_GID
          value: "123"
        image: docker:29.7.2-dind
        name: dind
        restartPolicy: Always
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command:
            - docker
            - info
          failureThreshold: 24
          initialDelaySeconds: 0
          periodSeconds: 5
        volumeMounts:
        - mountPath: /home/runner/_work
          name: work
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /home/runner/externals
          name: dind-externals
        - mountPath: /opt/hostedtoolcache
          name: tool-cache
      containers:
      
      - name: runner
        command: 
          - /home/runner/run.sh
        image: 
          registry.digitalocean.com/redducklabs/github-runner:latest
        imagePullPolicy: 
          Always
        securityContext: 
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsGroup: 121
          runAsUser: 1001
        env:
          - 
            name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - 
            name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          - 
            name: RUNNER_TOOL_CACHE
            value: /opt/hostedtoolcache
          - 
            name: AGENT_TOOLSDIRECTORY
            value: /opt/hostedtoolcache
        volumeMounts:
          - 
            mountPath: /home/runner/_work
            name: work
          - 
            mountPath: /var/run
            name: dind-sock
          - 
            mountPath: /opt/hostedtoolcache
            name: tool-cache
      volumes:
      - emptyDir: {}
        name: work
      - emptyDir: {}
        name: dind-sock
      - emptyDir: {}
        name: dind-externals
      - emptyDir: {}
        name: tool-cache
