name: Emergency Stop Runners

# Sets the runner scale set to minRunners=maxRunners=0 with --reuse-values, so
# the release keeps its base template (burst, density or drain) and the
# pool-state gate classifies the result as the matching `stopped` state
# (burst-stopped, density-stopped or drain-stopped; Ruling 26 in
# docs/specs/2026-10-26-runner-burst-autoscaling-design.md). The recovery
# paths admit those states; the summary names the one that applies.
#
# Concurrency (Ruling 28): Emergency Stop uses its own non-cancelling group,
# runner-emergency-stop, so it runs immediately instead of waiting behind a
# multi-hour Deploy drain or Scale Runners Phase C in runner-fleet-mutation.
# A fleet mutation that is in flight when it runs fails closed at its next
# identity comparison or admission: the ARC identity changed and the stopped
# state is not admitted for the in-flight operation.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "STOP-RUNNERS" to confirm emergency shutdown'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'arc-runners'
        type: string
      reason:
        description: 'Reason for emergency stop'
        required: false
        default: 'Emergency shutdown initiated via GitHub Actions'
        type: string

concurrency:
  group: runner-emergency-stop
  cancel-in-progress: false

env:
  # CLUSTER_NAME = DO cluster NAME for `doctl ... kubeconfig save`; CLUSTER_CONTEXT
  # = the generated kubeconfig context (do-<region>-<name>) for `use-context`.
  # They are different strings — see deploy-runners.yml for the full note.
  # (Critical here: emergency-stop must reach the cluster reliably.)
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}
  RELEASE_NAME: ${{ vars.RELEASE_NAME || 'redducklabs-runners' }}
  # The release's pinned chart (deploy-runners.yml ARC_CHART_VERSION). An
  # unpinned upgrade would move the release to another chart version, which
  # the ARC identity check rejects for every recovery path.
  ARC_CHART_VERSION: '0.14.2'

# Use minimal permissions
permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate Emergency Stop Inputs
    runs-on: ubuntu-latest
    # Explicit bash runs every step as "bash --noprofile --norc -eo pipefail",
    # so a failing command inside a pipeline fails the step.
    defaults:
      run:
        shell: bash
    outputs:
      namespace: ${{ steps.validate.outputs.namespace }}
      reason: ${{ steps.validate.outputs.reason }}

    steps:
      - name: Validate confirmation and inputs
        id: validate
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_REASON: ${{ inputs.reason }}
        run: |
          echo "🔍 Validating emergency stop inputs..."

          # Get inputs
          CONFIRM="${INPUT_CONFIRM}"
          NAMESPACE="${INPUT_NAMESPACE}"
          REASON="${INPUT_REASON}"

          # Validate confirmation text
          if [ "${CONFIRM}" != "STOP-RUNNERS" ]; then
            echo "❌ Confirmation text does not match!"
            echo "You must type exactly: STOP-RUNNERS"
            echo "Received: '${CONFIRM}'"
            exit 1
          fi

          # Validate namespace format (DNS-1123 label)
          if ! [[ "${NAMESPACE}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "❌ Error: namespace must be a valid DNS-1123 label"
            exit 1
          fi

          # Validate reason is not empty and reasonable length
          if [ -z "${REASON}" ]; then
            echo "❌ Error: reason cannot be empty"
            exit 1
          fi
          if [[ "${REASON}" == *$'\r'* || "${REASON}" == *$'\n'* ]]; then
            echo "❌ Error: reason must be a single line"
            exit 1
          fi

          if [ ${#REASON} -gt 200 ]; then
            echo "❌ Error: reason must be 200 characters or less"
            exit 1
          fi

          # Sanitize reason (remove potentially dangerous characters)
          CLEAN_REASON=$(printf '%s' "${REASON}" | tr -cd '[:alnum:][:space:][:punct:]' | head -c 200)

          # Set validated outputs
          printf 'namespace=%s\n' "${NAMESPACE}" >> "${GITHUB_OUTPUT}"
          printf 'reason=%s\n' "${CLEAN_REASON}" >> "${GITHUB_OUTPUT}"

          echo "⚠️ EMERGENCY STOP CONFIRMED"
          echo "  Namespace: ${NAMESPACE}"
          echo "  Reason: ${CLEAN_REASON}"

  emergency-stop:
    name: Emergency Stop All Runners
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 10
    # Explicit bash (pipefail): a failed read inside a pipeline fails the step
    # instead of being counted as "no deployment" or "0 pods".
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Configure Kubernetes access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          echo "🔧 Configuring Kubernetes access..."

          # Validate DO_TOKEN
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi

          # Initialize doctl with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${DO_TOKEN}" > /dev/null; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done

          # Configure kubectl with retry logic.
          # kubeconfig save takes the cluster NAME; use-context takes the context.
          echo "Configuring kubectl for cluster ${CLUSTER_NAME} (context ${CLUSTER_CONTEXT})..."
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring kubectl..."
            if doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"; then
              kubectl config use-context "${CLUSTER_CONTEXT}"
              echo "✅ Kubernetes access configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to configure kubectl"
              exit 1
            else
              echo "⚠️ kubectl configuration failed, retrying in 5s..."
              sleep 5
            fi
          done
          CURRENT_CONTEXT=$(kubectl config current-context)
          if [ "${CURRENT_CONTEXT}" != "${CLUSTER_CONTEXT}" ]; then
            echo "❌ Error: kubectl context is '${CURRENT_CONTEXT}', expected '${CLUSTER_CONTEXT}'"
            exit 1
          fi

      - name: Record current state
        id: backup
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "📸 Recording current state before shutdown..."

          # A failed release list fails the run: it is never reported as
          # "no deployment".
          if ! RELEASES=$(helm list -n "${NAMESPACE}" -a -o json); then
            echo "❌ Error: could not list Helm releases in ${NAMESPACE}; nothing was changed"
            exit 1
          fi
          if ! MATCHES=$(jq -er --arg name "${RELEASE_NAME}" \
            'if type == "array" then [.[] | select(.name == $name)] | length else error("not an array") end' \
            <<<"${RELEASES}"); then
            echo "❌ Error: the Helm release list is not a JSON array; nothing was changed"
            exit 1
          fi
          if [ "${MATCHES}" = 0 ]; then
            echo "⚠️ Warning: Runner deployment '${RELEASE_NAME}' not found in namespace '${NAMESPACE}'"
            echo "deployment_exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "deployment_exists=true" >> "${GITHUB_OUTPUT}"
          REVISION=$(jq -r --arg name "${RELEASE_NAME}" \
            '[.[] | select(.name == $name)][0].revision // "unknown"' <<<"${RELEASES}")
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"

          # The stop must not wait on these reads: a failure is recorded as
          # "unknown" and fails the run after the stop (Report read failures).
          if VALUES_JSON=$(helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json) \
            && CURRENT_MIN=$(jq -er '.minRunners | numbers' <<<"${VALUES_JSON}") \
            && CURRENT_MAX=$(jq -er '.maxRunners | numbers' <<<"${VALUES_JSON}"); then
            :
          else
            echo "❌ Error: could not read the current runner bounds"
            CURRENT_MIN=unknown
            CURRENT_MAX=unknown
            echo "read_failed=true" >> "${GITHUB_OUTPUT}"
          fi
          if ! POD_COUNT=$(kubectl get pods -n "${NAMESPACE}" \
            -l actions.github.com/scale-set-name="${RELEASE_NAME}" -o json | jq -er '.items | length'); then
            echo "❌ Error: could not read the runner pods"
            POD_COUNT=unknown
            echo "read_failed=true" >> "${GITHUB_OUTPUT}"
          fi
          {
            echo "current_min=${CURRENT_MIN}"
            echo "current_max=${CURRENT_MAX}"
            echo "pod_count=${POD_COUNT}"
          } >> "${GITHUB_OUTPUT}"

          echo "Current state recorded:"
          echo "  Helm revision: ${REVISION}"
          echo "  Min runners: ${CURRENT_MIN}"
          echo "  Max runners: ${CURRENT_MAX}"
          echo "  Runner pods: ${POD_COUNT}"

      - name: Scale to zero
        if: steps.backup.outputs.deployment_exists == 'true'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          STOP_REASON: ${{ needs.validate-inputs.outputs.reason }}
        run: |
          echo "🛑 INITIATING EMERGENCY STOP..."
          echo "Reason: ${STOP_REASON}"

          # Scale to zero with retry logic. --reuse-values keeps the base
          # template; the chart version stays pinned; 100 revisions are kept
          # so the recorded density rollback revision is not pruned.
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Scaling to zero..."
            if helm upgrade "${RELEASE_NAME}" \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
              --namespace "${NAMESPACE}" \
              --version "${ARC_CHART_VERSION}" \
              --reuse-values \
              --set minRunners=0 \
              --set maxRunners=0 \
              --history-max 100 \
              --wait \
              --timeout 120s; then

              echo "✅ Runners scaled to zero"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to scale runners to zero"
              echo "⚠️ Manual intervention may be required"
              exit 1
            else
              echo "⚠️ Scaling failed, retrying in 5s..."
              sleep 5
            fi
          done

      - name: Verify shutdown
        if: steps.backup.outputs.deployment_exists == 'true'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "🔍 Verifying shutdown..."

          # runner_pods: prints the runner pod count; a failed read fails the
          # step (pipefail) instead of counting as zero pods.
          runner_pods() {
            kubectl get pods -n "${NAMESPACE}" \
              -l actions.github.com/scale-set-name="${RELEASE_NAME}" -o json | jq -er '.items | length'
          }

          # Wait for pods to terminate with timeout
          echo "Waiting for pods to terminate..."
          timeout=60
          while [ "${timeout}" -gt 0 ]; do
            if ! REMAINING=$(runner_pods); then
              echo "❌ Error: could not read the runner pods"
              exit 1
            fi
            if [ "${REMAINING}" -eq 0 ]; then
              echo "✅ All runner pods have been terminated"
              break
            fi
            echo "⏳ ${REMAINING} pod(s) still terminating... (${timeout}s remaining)"
            sleep 5
            timeout=$((timeout - 5))
          done

          # Final check
          if ! FINAL_COUNT=$(runner_pods); then
            echo "❌ Error: could not read the runner pods"
            exit 1
          fi
          if [ "${FINAL_COUNT}" -eq 0 ]; then
            echo "✅ Emergency stop completed successfully"
          else
            # A busy runner finishes its job before ARC deletes it.
            echo "⚠️ Warning: ${FINAL_COUNT} pod(s) may still be terminating"
            echo "Pod status:"
            kubectl get pods -n "${NAMESPACE}" -l actions.github.com/scale-set-name="${RELEASE_NAME}"
          fi

      - name: Read back stopped state
        id: readback
        if: steps.backup.outputs.deployment_exists == 'true'
        run: |
          # Read-only pool-state gate: the release must now be one of the
          # stopped states the recovery paths admit.
          STATE_LINE=$(./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" --operation status)
          echo "${STATE_LINE}"
          if ! [[ "${STATE_LINE}" =~ ^STATE:\ arc=(burst|density|drain)-stopped\ pools=(none|primary|fallback|both)\ burst=(open|closed)$ ]]; then
            echo "❌ Error: the stopped release is not a stopped state the recovery paths admit: ${STATE_LINE}"
            exit 1
          fi
          echo "state=${STATE_LINE#STATE: }" >> "${GITHUB_OUTPUT}"

      - name: Report read failures
        if: steps.backup.outputs.read_failed == 'true'
        run: |
          echo "❌ Error: the runner bounds or pods could not be read before the stop; see 'Record current state'"
          exit 1

      - name: Handle non-existent deployment
        if: steps.backup.outputs.deployment_exists == 'false'
        run: |
          echo "ℹ️ No active runner deployment found to stop"
          {
            echo "## ℹ️ No Active Deployment"
            echo "No runner deployment was found in the specified namespace."
            echo "This may indicate that runners were not deployed or already stopped."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create recovery instructions
        if: always()
        env:
          STOP_REASON: ${{ needs.validate-inputs.outputs.reason }}
          ACTOR: ${{ github.actor }}
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          DEPLOYMENT_EXISTS: ${{ steps.backup.outputs.deployment_exists }}
          PREVIOUS_REVISION: ${{ steps.backup.outputs.revision }}
          CURRENT_MIN: ${{ steps.backup.outputs.current_min }}
          CURRENT_MAX: ${{ steps.backup.outputs.current_max }}
          POD_COUNT: ${{ steps.backup.outputs.pod_count }}
          STOPPED_STATE: ${{ steps.readback.outputs.state }}
        run: |
          {
            echo "## 🛑 Emergency Stop Report"
            echo ""
            echo "### Stop Details"
            echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Initiated by**: @${ACTOR}"
            echo "- **Reason**: ${STOP_REASON}"
            echo "- **Namespace**: \`${NAMESPACE}\`"
            echo ""
            if [ "${DEPLOYMENT_EXISTS}" = "true" ]; then
              echo "### Previous Configuration"
              echo "- **Helm revision before the stop**: ${PREVIOUS_REVISION}"
              echo "- **Min Runners**: ${CURRENT_MIN}"
              echo "- **Max Runners**: ${CURRENT_MAX}"
              echo "- **Runner Pods**: ${POD_COUNT}"
              echo ""
              echo "### Stopped state"
              echo "\`${STOPPED_STATE:-not read back; run Runner Status}\`"
              echo ""
              echo "### Recovery Instructions"
              echo ""
              echo "Restore runners only through the reviewed CI path (\`docs/runbooks/node-pool-sizing.md\`, \"Emergency Stop\"). Each workflow admits the stopped state below:"
              echo ""
              case "${STOPPED_STATE}" in
                arc=burst-stopped*)
                  echo "- **Resume burst**: Deploy GitHub Runners \`operation=deploy\` with the reviewed commit's \`expected_sha\` restores \`burst\` (2/20)."
                  echo "- **Leave burst instead**: Deploy GitHub Runners \`operation=drain\` with the recorded density \`rollback_revision\`, then Node Pool Sizing \`remove-burst\`, then Deploy \`operation=rollback\`."
                  ;;
                arc=drain-stopped*)
                  echo "- Node Pool Sizing \`remove-burst\` (when the burst pools have zero nodes), then Deploy GitHub Runners \`operation=rollback\` with the recorded density \`rollback_revision\`."
                  ;;
                arc=density-stopped*)
                  echo "- If closed burst pools exist, Node Pool Sizing \`remove-burst\` first; then Deploy GitHub Runners \`operation=rollback\` with a density \`rollback_revision\` (revision ${PREVIOUS_REVISION} was the release before this stop; the rollback validates it as density)."
                  ;;
                *)
                  echo "- The stopped state was not read back. Run **Runner Status**, then follow the runbook's Emergency Stop section."
                  ;;
              esac
              echo ""
              echo "Do not change the release from a workstation."
              echo ""
              echo "⚠️ **All GitHub Actions workflows using these runners will fail until restored!**"
            else
              echo "### Status"
              echo "No active runner deployment was found to stop."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Send notification
        if: always()
        env:
          STOP_REASON: ${{ needs.validate-inputs.outputs.reason }}
          ACTOR: ${{ github.actor }}
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          DEPLOYMENT_EXISTS: ${{ steps.backup.outputs.deployment_exists }}
          CURRENT_MIN: ${{ steps.backup.outputs.current_min }}
          CURRENT_MAX: ${{ steps.backup.outputs.current_max }}
        run: |
          echo "📧 Emergency stop notification:"
          echo "  - Emergency stop procedure completed"
          echo "  - Initiated by: @${ACTOR}"
          echo "  - Reason: ${STOP_REASON}"
          echo "  - Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  - Namespace: ${NAMESPACE}"
          if [ "${DEPLOYMENT_EXISTS}" = "true" ]; then
            echo "  - Previous config: Min=${CURRENT_MIN}, Max=${CURRENT_MAX}"
          else
            echo "  - No deployment found to stop"
          fi
