name: Scale GitHub Runners

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Scaling action to perform'
        required: true
        type: choice
        options:
          - 'status'
          - 'scale-up'
          - 'scale-down'
          - 'scale-max'
          - 'scale-custom'
          - 'rollout-quiesce'
      min_runners:
        description: 'Minimum runners (for custom scaling)'
        required: false
        default: '2'
        type: string
      max_runners:
        description: 'Maximum runners (for custom scaling)'
        required: false
        default: '4'
        type: string
      expected_sha:
        description: 'Exact commit SHA to scale'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'arc-runners'
        type: string

concurrency:
  group: runner-fleet-mutation
  cancel-in-progress: false

env:
  # CLUSTER_NAME = DO cluster NAME for `doctl ... kubeconfig save`; CLUSTER_CONTEXT
  # = the generated kubeconfig context (do-<region>-<name>) for `use-context`.
  # They are different strings — see deploy-runners.yml for the full note.
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}
  RELEASE_NAME: ${{ vars.RELEASE_NAME || 'redducklabs-runners' }}
  ARC_CHART_VERSION: '0.14.2'

# Use minimal permissions
permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate Scaling Inputs
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.validate.outputs.action }}
      expected_sha: ${{ steps.validate.outputs.expected_sha }}
      min_runners: ${{ steps.validate.outputs.min_runners }}
      max_runners: ${{ steps.validate.outputs.max_runners }}
      namespace: ${{ steps.validate.outputs.namespace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and sanitize inputs
        id: validate
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_MIN_RUNNERS: ${{ inputs.min_runners }}
          INPUT_MAX_RUNNERS: ${{ inputs.max_runners }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          echo "🔍 Validating scaling inputs..."
          
          # Get and validate inputs
          ACTION="${INPUT_ACTION}"
          MIN_RUNNERS="${INPUT_MIN_RUNNERS}"
          MAX_RUNNERS="${INPUT_MAX_RUNNERS}"
          NAMESPACE="${INPUT_NAMESPACE}"
          EXPECTED_SHA="${INPUT_EXPECTED_SHA}"

          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Error: expected_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          
          # Non-custom actions ignore the optional custom inputs and emit only
          # their fixed canonical bounds. This prevents a multiline custom
          # value from creating additional GITHUB_OUTPUT records.
          case "${ACTION}" in
            status) MIN_RUNNERS=2; MAX_RUNNERS=4 ;;
            scale-up) MIN_RUNNERS=2; MAX_RUNNERS=4 ;;
            scale-down) MIN_RUNNERS=0; MAX_RUNNERS=1 ;;
            scale-max) MIN_RUNNERS=4; MAX_RUNNERS=4 ;;
            rollout-quiesce) MIN_RUNNERS=2; MAX_RUNNERS=2 ;;
            scale-custom) ;;
            *)
              echo "❌ Error: Invalid action '${ACTION}'"
              exit 1
              ;;
          esac
          echo "✅ Valid action: ${ACTION}"
          
          # Validate namespace format (DNS-1123 label)
          if ! [[ "${NAMESPACE}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "❌ Error: namespace must be a valid DNS-1123 label"
            exit 1
          fi
          
          # For custom scaling, validate numeric inputs
          if [ "${ACTION}" = "scale-custom" ]; then
            # Validate min_runners is numeric
            if ! [[ "${MIN_RUNNERS}" =~ ^[0-9]+$ ]]; then
              echo "❌ Error: min_runners must be a number"
              exit 1
            fi
            
            # Validate max_runners is numeric
            if ! [[ "${MAX_RUNNERS}" =~ ^[0-9]+$ ]]; then
              echo "❌ Error: max_runners must be a number"
              exit 1
            fi
            
            # Validate min <= max
            if [ "${MIN_RUNNERS}" -gt "${MAX_RUNNERS}" ]; then
              echo "❌ Error: min_runners (${MIN_RUNNERS}) cannot be greater than max_runners (${MAX_RUNNERS})"
              exit 1
            fi
            
            # Validate bounds before any value can be emitted or reach Helm.
            if [ "${MIN_RUNNERS}" -gt 4 ]; then
              echo "❌ Error: min_runners must be between 0 and 4"
              exit 1
            fi
            
            if [ "${MAX_RUNNERS}" -lt 1 ] || [ "${MAX_RUNNERS}" -gt 4 ]; then
              echo "❌ Error: max_runners must be between 1 and 4"
              exit 1
            fi
          fi
          
          write_output() {
            local key=$1 value=$2
            if ! [[ "${key}" =~ ^[a-z_]+$ ]] \
               || [[ "${value}" == *$'\r'* || "${value}" == *$'\n'* ]]; then
              echo "❌ Error: refusing unsafe workflow output ${key}"
              return 1
            fi
            printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_OUTPUT}"
          }

          write_output action "${ACTION}"
          write_output expected_sha "${EXPECTED_SHA}"
          write_output min_runners "${MIN_RUNNERS}"
          write_output max_runners "${MAX_RUNNERS}"
          write_output namespace "${NAMESPACE}"
          
          echo "✅ All inputs validated successfully"
          echo "  Action: ${ACTION}"
          echo "  Namespace: ${NAMESPACE}"
          if [ "${ACTION}" = "scale-custom" ]; then
            echo "  Min runners: ${MIN_RUNNERS}"
            echo "  Max runners: ${MAX_RUNNERS}"
          fi

  scale:
    name: Scale Runners - ${{ needs.validate-inputs.outputs.action }}
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 10
    outputs:
      rollback_revision: ${{ steps.rollout-quiesce.outputs.rollback_revision }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'
      
      - name: Configure Kubernetes access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          echo "🔧 Configuring Kubernetes access..."
          
          # Validate DO_TOKEN
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi
          
          # Initialize doctl with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${DO_TOKEN}"; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          # Configure kubectl with retry logic.
          # kubeconfig save takes the cluster NAME; use-context takes the context.
          echo "Configuring kubectl for cluster ${CLUSTER_NAME} (context ${CLUSTER_CONTEXT})..."
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring kubectl..."
            if doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"; then
              kubectl config use-context "${CLUSTER_CONTEXT}"
              echo "✅ Kubernetes access configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to configure kubectl"
              exit 1
            else
              echo "⚠️ kubectl configuration failed, retrying in 5s..."
              sleep 5
            fi
          done
      
      - name: Check current status
        id: current-status
        env:
          ACTION: ${{ needs.validate-inputs.outputs.action }}
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "📊 Checking current runner status..."
          
          # Check if release exists
          if ! helm list -n "${NAMESPACE}" 2>/dev/null | grep -q "${RELEASE_NAME}"; then
            echo "❌ Error: Runner deployment '${RELEASE_NAME}' not found in namespace '${NAMESPACE}'"
            echo "Please deploy runners first using the 'Deploy GitHub Runners' workflow"
            exit 1
          fi
          
          # Get current values with error handling
          VALUES_JSON=$(helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json 2>/dev/null)
          if [ $? -ne 0 ]; then
            echo "❌ Error: Could not retrieve current Helm values"
            exit 1
          fi
          
          CURRENT_MIN=$(echo "${VALUES_JSON}" | jq -r '.minRunners // 2')
          CURRENT_MAX=$(echo "${VALUES_JSON}" | jq -r '.maxRunners // 4')
          
          # Validate retrieved values
          if ! [[ "${CURRENT_MIN}" =~ ^[0-9]+$ ]] || ! [[ "${CURRENT_MAX}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: Invalid current values retrieved from Helm"
            exit 1
          fi

          case "${ACTION}" in
            scale-up|scale-down|scale-max|scale-custom)
              RELEASES=$(helm list -n "${NAMESPACE}" -o json)
              if ! jq -e --arg name "${RELEASE_NAME}" --arg version "${ARC_CHART_VERSION}" '
                [.[] | select(.name == $name
                  and .chart == ("gha-runner-scale-set-" + $version)
                  and .status == "deployed")] | length == 1
              ' <<<"${RELEASES}" >/dev/null; then
                echo "❌ Error: ordinary scaling requires the pinned deployed runner chart"
                exit 1
              fi
              validate_density() {
                local kind=$1
                python3 scripts/validate-runner-isolation-contract.py \
                  --contract density --kind "${kind}" \
                  --min-runners "${CURRENT_MIN}" --max-runners "${CURRENT_MAX}" \
                  --runner-group private
              }
              validate_density values <<<"${VALUES_JSON}" || {
                echo "❌ Error: ordinary scaling prestate violates the exact density contract"
                exit 1
              }
              CURRENT_MANIFEST="${RUNNER_TEMP}/ordinary-scale-prestate.yaml"
              helm get manifest "${RELEASE_NAME}" -n "${NAMESPACE}" > "${CURRENT_MANIFEST}"
              validate_density manifest < "${CURRENT_MANIFEST}" || exit 1
              CURRENT_ASRS=$(kubectl get autoscalingrunnersets.actions.github.com \
                -n "${NAMESPACE}" -o json)
              validate_density asrs-list <<<"${CURRENT_ASRS}" || exit 1
              ;;
          esac
          
          echo "current_min=${CURRENT_MIN}" >> $GITHUB_OUTPUT
          echo "current_max=${CURRENT_MAX}" >> $GITHUB_OUTPUT
          
          echo "Current configuration:"
          echo "  Min runners: ${CURRENT_MIN}"
          echo "  Max runners: ${CURRENT_MAX}"
          
          # Get pod count
          POD_COUNT=$(kubectl get pods -n "${NAMESPACE}" -l actions.github.com/scale-set-name="${RELEASE_NAME}" --no-headers 2>/dev/null | wc -l)
          echo "pod_count=${POD_COUNT}" >> $GITHUB_OUTPUT
          echo "  Active pods: ${POD_COUNT}"

      - name: Check runner pool capacity
        if: needs.validate-inputs.outputs.action != 'status'
        env:
          ACTION: ${{ needs.validate-inputs.outputs.action }}
        run: |
          echo "📐 Validating fixed runner-pool capacity before scaling..."
          POOL_NAME="github-runners-pool-16g"

          CLUSTER_ID=$(doctl kubernetes cluster list -o json \
            | jq -r --arg n "${CLUSTER_NAME}" '.[] | select(.name==$n) | .id')
          if [ -z "${CLUSTER_ID}" ] || [ "${CLUSTER_ID}" = "null" ]; then
            echo "❌ Error: cluster '${CLUSTER_NAME}' was not found"
            exit 1
          fi

          POOL_JSON=$(doctl kubernetes cluster node-pool list "${CLUSTER_ID}" -o json \
            | jq -r --arg p "${POOL_NAME}" '.[] | select(.name==$p)')
          if [ -z "${POOL_JSON}" ]; then
            echo "❌ Error: runner pool '${POOL_NAME}' was not found"
            exit 1
          fi

          POOL_MIN=$(echo "${POOL_JSON}" | jq -r '.min_nodes')
          POOL_MAX=$(echo "${POOL_JSON}" | jq -r '.max_nodes')
          POOL_COUNT=$(echo "${POOL_JSON}" | jq -r '.count')
          POOL_SIZE=$(echo "${POOL_JSON}" | jq -r '.size')
          POOL_AUTOSCALE=$(echo "${POOL_JSON}" | jq -r '.auto_scale')
          if [ "${ACTION}" = "rollout-quiesce" ]; then
            case "${POOL_MAX}" in 2|8) ;; *)
              echo "❌ Error: rollout-quiesce requires current max_nodes 8 or 2; found ${POOL_MAX}"
              exit 1
              ;;
            esac
          elif [ "${POOL_MAX}" != "2" ]; then
            echo "❌ Error: runner pool max_nodes must already be 2 for ${ACTION}; found ${POOL_MAX}"
            exit 1
          fi
          if [ "${POOL_MIN}" != "2" ] || [ "${POOL_COUNT}" != "2" ] \
             || [ "${POOL_SIZE}" != "s-8vcpu-16gb" ] \
             || [ "${POOL_AUTOSCALE}" != "true" ]; then
            echo "❌ Error: runner pool must be min/count=2/2, size=s-8vcpu-16gb, autoscaling enabled; found min=${POOL_MIN} count=${POOL_COUNT} size=${POOL_SIZE} auto_scale=${POOL_AUTOSCALE}"
            exit 1
          fi

          NODES=$(kubectl get nodes -l node-type=github-runner -o json)
          TOTAL_NODES=$(jq '.items | length' <<<"${NODES}")
          READY_NODES=$(jq '[.items[] | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))] | length' <<<"${NODES}")
          if [ "${TOTAL_NODES}" != "2" ] || [ "${READY_NODES}" != "2" ]; then
            echo "❌ Error: runner pool requires exactly two Ready nodes; found ${READY_NODES}/${TOTAL_NODES}"
            exit 1
          fi

          echo "✅ Runner pool capacity is fixed at two Ready nodes"

      - name: Quiesce rollout and record rollback revision
        id: rollout-quiesce
        if: needs.validate-inputs.outputs.action == 'rollout-quiesce'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          validate_isolated_values() {
            local expected_max=$1 expected_group=$2
            python3 scripts/validate-runner-isolation-contract.py \
              --contract legacy-isolated --kind values \
              --min-runners 2 --max-runners "${expected_max}" \
              --runner-group "${expected_group}"
          }

          validate_isolated_manifest() {
            local manifest=$1 expected_max=$2 expected_group=$3
            python3 scripts/validate-runner-isolation-contract.py \
              --contract legacy-isolated --kind manifest \
              --min-runners 2 --max-runners "${expected_max}" \
              --runner-group "${expected_group}" \
              < "${manifest}"
          }

          RELEASES=$(helm list -n "${NAMESPACE}" -o json)
          if ! jq -e --arg name "${RELEASE_NAME}" --arg version "${ARC_CHART_VERSION}" '
            [.[] | select(.name == $name
              and .chart == ("gha-runner-scale-set-" + $version)
              and .status == "deployed")] | length == 1
          ' <<<"${RELEASES}" >/dev/null; then
            echo "❌ Error: rollout-quiesce requires deployed ${RELEASE_NAME} chart ${ARC_CHART_VERSION}"
            exit 1
          fi

          PRE_VALUES=$(helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json)
          PRE_MAX=$(jq -r '.maxRunners // empty' <<<"${PRE_VALUES}")
          PRE_GROUP=$(jq -r '.runnerGroup // "Default"' <<<"${PRE_VALUES}")
          case "${PRE_MAX}:${PRE_GROUP}" in
            8:Default)
              PRE_CONTRACT_GROUP=default
              ;;
            2:redducklabs-private-runners)
              PRE_CONTRACT_GROUP=private
              ;;
            *)
              echo "❌ Error: pre-quiesce release must be legacy Default 2/8 or private 2/2; found 2/${PRE_MAX} group='${PRE_GROUP}'"
              exit 1
              ;;
          esac
          if ! validate_isolated_values "${PRE_MAX}" "${PRE_CONTRACT_GROUP}" \
            <<<"${PRE_VALUES}"; then
            echo "❌ Error: pre-quiesce release is not the recognized isolated 2/${PRE_MAX}, 5Gi+5Gi ${PRE_GROUP} template"
            exit 1
          fi
          PRE_MANIFEST="${RUNNER_TEMP}/pre-quiesce-manifest.yaml"
          helm get manifest "${RELEASE_NAME}" -n "${NAMESPACE}" > "${PRE_MANIFEST}"
          validate_isolated_manifest "${PRE_MANIFEST}" "${PRE_MAX}" \
            "${PRE_CONTRACT_GROUP}"

          helm upgrade "${RELEASE_NAME}" \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            --namespace "${NAMESPACE}" \
            --reuse-values \
            --version "${ARC_CHART_VERSION}" \
            --set minRunners=2 \
            --set maxRunners=2 \
            --set runnerGroup=redducklabs-private-runners \
            --set template.spec.automountServiceAccountToken=false \
            --wait --timeout 300s

          QUIESCED=false
          for attempt in $(seq 1 30); do
            PODS=$(kubectl get pods -n "${NAMESPACE}" \
              -l actions.github.com/scale-set-name="${RELEASE_NAME}" -o json)
            PENDING=$(jq '[.items[] | select(.status.phase == "Pending")] | length' <<<"${PODS}")
            SETS=$(kubectl get ephemeralrunnersets.actions.github.com -n "${NAMESPACE}" \
              -l actions.github.com/scale-set-name="${RELEASE_NAME}" -o json)
            DESIRED=$(jq '[.items[] | (.spec.replicas // 0)] | add // 0' <<<"${SETS}")
            if [ "${PENDING}" = "0" ] && [ "${DESIRED}" -le 2 ]; then
              QUIESCED=true
              break
            fi
            sleep 10
          done
          if [ "${QUIESCED}" != "true" ]; then
            echo "❌ Error: ARC still has Pending runners or scale-up demand after quiesce"
            exit 1
          fi

          POST_VALUES=$(helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json)
          if ! validate_isolated_values 2 private <<<"${POST_VALUES}"; then
            echo "❌ Error: quiesced release values do not preserve the rollback template"
            exit 1
          fi
          POST_MANIFEST="${RUNNER_TEMP}/post-quiesce-manifest.yaml"
          helm get manifest "${RELEASE_NAME}" -n "${NAMESPACE}" > "${POST_MANIFEST}"
          validate_isolated_manifest "${POST_MANIFEST}" 2 \
            private
          LIVE_ASRS=$(kubectl get autoscalingrunnersets.actions.github.com \
            -n "${NAMESPACE}" -o json)
          if ! python3 scripts/validate-runner-isolation-contract.py \
            --contract legacy-isolated --kind asrs-list \
            --min-runners 2 --max-runners 2 --runner-group private \
            <<<"${LIVE_ASRS}"; then
            echo "❌ Error: live quiesced AutoscalingRunnerSet is not exact private 2/2 isolated state"
            exit 1
          fi
          HISTORY=$(helm history "${RELEASE_NAME}" -n "${NAMESPACE}" -o json)
          REVISION=$(jq -r --arg version "${ARC_CHART_VERSION}" '
            [.[] | select(.chart == ("gha-runner-scale-set-" + $version)
              and .status == "deployed") | .revision] | max // empty
          ' <<<"${HISTORY}")
          if ! [[ "${REVISION}" =~ ^[1-9][0-9]*$ ]]; then
            echo "❌ Error: could not identify the validated rollback revision"
            exit 1
          fi
          REVISION_VALUES=$(helm get values "${RELEASE_NAME}" --revision "${REVISION}" \
            -n "${NAMESPACE}" -o json)
          if ! validate_isolated_values 2 private \
            <<<"${REVISION_VALUES}"; then
            echo "❌ Error: rollback revision values are not exact private 2/2 isolated state"
            exit 1
          fi
          REVISION_MANIFEST="${RUNNER_TEMP}/quiesced-revision-manifest.yaml"
          helm get manifest "${RELEASE_NAME}" --revision "${REVISION}" \
            -n "${NAMESPACE}" > "${REVISION_MANIFEST}"
          validate_isolated_manifest "${REVISION_MANIFEST}" 2 \
            private
          echo "rollback_revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Rollout quiesced"
            echo ""
            echo "Validated rollback revision: **${REVISION}**"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "✅ ARC quiesced; validated rollback revision ${REVISION}"
      
      - name: Display status
        if: needs.validate-inputs.outputs.action == 'status'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "## 📊 Runner Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Min Runners**: ${{ steps.current-status.outputs.current_min }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max Runners**: ${{ steps.current-status.outputs.current_max }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Active Pods**: ${{ steps.current-status.outputs.pod_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`${NAMESPACE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: \`${RELEASE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pod Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n "${NAMESPACE}" -l actions.github.com/scale-set-name="${RELEASE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Scale up (default)
        if: needs.validate-inputs.outputs.action == 'scale-up'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "⬆️ Scaling up to default configuration..."
          
          # Scale with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Scaling up..."
            if helm upgrade "${RELEASE_NAME}" \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
              --namespace "${NAMESPACE}" \
              --reuse-values \
              --version "${ARC_CHART_VERSION}" \
              --set minRunners=2 \
              --set maxRunners=4 \
              --set runnerGroup=redducklabs-private-runners \
              --wait \
              --timeout 180s; then
              
              echo "✅ Scaled to: Min=2, Max=4"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to scale up runners"
              exit 1
            else
              echo "⚠️ Scaling failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          echo "## ✅ Scaled Up" >> $GITHUB_STEP_SUMMARY
          echo "Runners scaled to: **Min=2, Max=4**" >> $GITHUB_STEP_SUMMARY
      
      - name: Scale down (minimal)
        if: needs.validate-inputs.outputs.action == 'scale-down'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "⬇️ Scaling down to minimal configuration..."
          
          # Scale with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Scaling down..."
            if helm upgrade "${RELEASE_NAME}" \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
              --namespace "${NAMESPACE}" \
              --reuse-values \
              --version "${ARC_CHART_VERSION}" \
              --set minRunners=0 \
              --set maxRunners=1 \
              --set runnerGroup=redducklabs-private-runners \
              --wait \
              --timeout 180s; then
              
              echo "✅ Scaled to: Min=0, Max=1"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to scale down runners"
              exit 1
            else
              echo "⚠️ Scaling failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          echo "## ✅ Scaled Down" >> $GITHUB_STEP_SUMMARY
          echo "Runners scaled to: **Min=0, Max=1** (minimal)" >> $GITHUB_STEP_SUMMARY
      
      - name: Scale to maximum
        if: needs.validate-inputs.outputs.action == 'scale-max'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "⬆️⬆️ Scaling to maximum configuration..."
          
          # Scale with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Scaling to maximum..."
            if helm upgrade "${RELEASE_NAME}" \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
              --namespace "${NAMESPACE}" \
              --reuse-values \
              --version "${ARC_CHART_VERSION}" \
              --set minRunners=4 \
              --set maxRunners=4 \
              --set runnerGroup=redducklabs-private-runners \
              --wait \
              --timeout 180s; then
              
              echo "✅ Scaled to: Min=4, Max=4"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to scale to maximum"
              exit 1
            else
              echo "⚠️ Scaling failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          echo "## ✅ Scaled to Maximum" >> $GITHUB_STEP_SUMMARY
          echo "Runners scaled to: **Min=4, Max=4** (maximum)" >> $GITHUB_STEP_SUMMARY
      
      - name: Custom scaling
        if: needs.validate-inputs.outputs.action == 'scale-custom'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          MIN_RUNNERS: ${{ needs.validate-inputs.outputs.min_runners }}
          MAX_RUNNERS: ${{ needs.validate-inputs.outputs.max_runners }}
        run: |
          echo "🎯 Scaling to custom configuration..."
          
          # Scale with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Custom scaling..."
            if helm upgrade "${RELEASE_NAME}" \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
              --namespace "${NAMESPACE}" \
              --reuse-values \
              --version "${ARC_CHART_VERSION}" \
              --set minRunners="${MIN_RUNNERS}" \
              --set maxRunners="${MAX_RUNNERS}" \
              --set runnerGroup=redducklabs-private-runners \
              --wait \
              --timeout 180s; then
              
              echo "✅ Scaled to: Min=${MIN_RUNNERS}, Max=${MAX_RUNNERS}"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to apply custom scaling"
              exit 1
            else
              echo "⚠️ Scaling failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          echo "## ✅ Custom Scaling Applied" >> $GITHUB_STEP_SUMMARY
          echo "Runners scaled to: **Min=${MIN_RUNNERS}, Max=${MAX_RUNNERS}**" >> $GITHUB_STEP_SUMMARY
      
      - name: Verify scaling
        if: needs.validate-inputs.outputs.action != 'status'
        env:
          ACTION: ${{ needs.validate-inputs.outputs.action }}
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          MIN_RUNNERS: ${{ needs.validate-inputs.outputs.min_runners }}
          MAX_RUNNERS: ${{ needs.validate-inputs.outputs.max_runners }}
        run: |
          echo ""
          echo "⏳ Waiting for scaling to take effect..."
          sleep 10
          
          echo "📊 New runner status:"
          kubectl get pods -n "${NAMESPACE}" -l actions.github.com/scale-set-name="${RELEASE_NAME}"
          
          # Get new values with error handling
          NEW_VALUES=$(helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json 2>/dev/null)
          if [ $? -eq 0 ]; then
            NEW_MIN=$(echo "${NEW_VALUES}" | jq -r '.minRunners // 0')
            NEW_MAX=$(echo "${NEW_VALUES}" | jq -r '.maxRunners // 0')
            
            echo ""
            echo "### New Configuration" >> $GITHUB_STEP_SUMMARY
            echo "- **Min Runners**: ${NEW_MIN}" >> $GITHUB_STEP_SUMMARY
            echo "- **Max Runners**: ${NEW_MAX}" >> $GITHUB_STEP_SUMMARY
            
            # Verify scaling worked as expected
            case "${ACTION}" in
              scale-up)
                if [ "${NEW_MIN}" = "2" ] && [ "${NEW_MAX}" = "4" ]; then
                  echo "✅ Scale up verified"
                else
                  echo "❌ Scale up did not apply correctly"; exit 1
                fi
                ;;
              scale-down)
                if [ "${NEW_MIN}" = "0" ] && [ "${NEW_MAX}" = "1" ]; then
                  echo "✅ Scale down verified"
                else
                  echo "❌ Scale down did not apply correctly"; exit 1
                fi
                ;;
              scale-max)
                if [ "${NEW_MIN}" = "4" ] && [ "${NEW_MAX}" = "4" ]; then
                  echo "✅ Scale to maximum verified"
                else
                  echo "❌ Scale to maximum did not apply correctly"; exit 1
                fi
                ;;
              scale-custom)
                if [ "${NEW_MIN}" = "${MIN_RUNNERS}" ] && [ "${NEW_MAX}" = "${MAX_RUNNERS}" ]; then
                  echo "✅ Custom scaling verified"
                else
                  echo "❌ Custom scaling did not apply correctly"; exit 1
                fi
                ;;
            esac
            if [ "${ACTION}" != "rollout-quiesce" ]; then
              validate_density_result() {
                local kind=$1
                python3 scripts/validate-runner-isolation-contract.py \
                  --contract density --kind "${kind}" \
                  --min-runners "${NEW_MIN}" --max-runners "${NEW_MAX}" \
                  --runner-group private
              }
              validate_density_result values <<<"${NEW_VALUES}" || exit 1
              NEW_MANIFEST="${RUNNER_TEMP}/ordinary-scale-result.yaml"
              helm get manifest "${RELEASE_NAME}" -n "${NAMESPACE}" > "${NEW_MANIFEST}"
              validate_density_result manifest < "${NEW_MANIFEST}" || exit 1
              NEW_ASRS=$(kubectl get autoscalingrunnersets.actions.github.com \
                -n "${NAMESPACE}" -o json)
              validate_density_result asrs-list <<<"${NEW_ASRS}" || exit 1
            fi
          else
            echo "❌ Could not verify new configuration"
            exit 1
          fi
