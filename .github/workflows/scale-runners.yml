name: Scale GitHub Runners

# Ordinary min/max scaling is retired (docs/specs/2026-10-26-runner-burst-autoscaling-design.md,
# "No ordinary runtime scaling"): runner bounds change only by a reviewed
# commit to deploy/dind-values.yaml followed by Deploy. This workflow keeps
# two actions:
#
#   record-density      read-only; validates the live release as the density
#                       contract (2/4) and emits its Helm revision as the
#                       rollback target (output rollback_revision)
#   acceptance-phase-c  acceptance Phase C as one lock-owning run
#                       (scripts/acceptance-phase-c.sh); a final always-run
#                       step returns ARC to burst whether the run succeeded,
#                       failed or was cancelled
#
# Both admit the live state with scripts/verify-runner-pool-state.sh under
# their own operation name after expected_sha is verified.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - 'record-density'
          - 'acceptance-phase-c'
      expected_sha:
        description: 'Exact commit SHA to run'
        required: true
        type: string

concurrency:
  group: runner-fleet-mutation
  cancel-in-progress: false

env:
  # CLUSTER_NAME = DO cluster NAME for `doctl ... kubeconfig save`; CLUSTER_CONTEXT
  # = the generated kubeconfig context (do-<region>-<name>) for `use-context`.
  # They are different strings — see deploy-runners.yml for the full note.
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}
  RELEASE_NAME: ${{ vars.RELEASE_NAME || 'redducklabs-runners' }}
  ARC_CHART_VERSION: '0.14.2'

# Use minimal permissions
permissions:
  contents: read

jobs:
  scale:
    name: Scale Runners - ${{ inputs.action }}
    runs-on: ubuntu-latest
    # Phase C stops itself at 270 minutes so the cleanup step fits.
    timeout-minutes: 300
    # Explicit bash runs every step as "bash --noprofile --norc -eo pipefail",
    # so a failing command inside a pipeline fails the step.
    defaults:
      run:
        shell: bash
    outputs:
      rollback_revision: ${{ steps.record.outputs.rollback_revision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Validate and sanitize inputs
        id: validate
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          # The SHA is verified before any other input and before any step
          # that reads or changes the cluster.
          EXPECTED_SHA="${INPUT_EXPECTED_SHA}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Error: expected_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          case "${INPUT_ACTION}" in
            record-density|acceptance-phase-c) ;;
            *)
              echo "❌ Error: action must be record-density or acceptance-phase-c"
              exit 1
              ;;
          esac
          {
            echo "action=${INPUT_ACTION}"
            echo "expected_sha=${EXPECTED_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "✅ ${INPUT_ACTION} at ${ACTUAL_SHA}"

      - name: Configure Kubernetes access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${DO_TOKEN}" > /dev/null; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done
          # kubeconfig save takes the cluster NAME; use-context takes the context.
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"
          CURRENT_CONTEXT=$(kubectl config current-context)
          if [ "${CURRENT_CONTEXT}" != "${CLUSTER_CONTEXT}" ]; then
            echo "❌ Error: kubectl context is '${CURRENT_CONTEXT}', expected '${CLUSTER_CONTEXT}'"
            exit 1
          fi
          echo "✅ kubectl context is ${CURRENT_CONTEXT}"

      - name: Admit pool state and record identities
        id: admit
        env:
          ACTION: ${{ steps.validate.outputs.action }}
        run: |
          # Each action is admitted under its own gate operation name.
          case "${ACTION}" in
            record-density) OPERATION=record-density ;;
            acceptance-phase-c) OPERATION=acceptance-phase-c ;;
            *)
              echo "❌ Error: unknown action"
              exit 1
              ;;
          esac
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation "${OPERATION}" \
            --emit-identities "${RUNNER_TEMP}/pool-identities.json"
          # Written only after the SHA check and the gate admitted Phase C
          # (from burst, or from an interrupted burst-acceptance 8/20 or 4/20):
          # it authorizes the always-run cleanup to write to Helm.
          if [ "${OPERATION}" = acceptance-phase-c ]; then
            echo "cleanup_eligible=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Record density rollback revision
        id: record
        if: steps.validate.outputs.action == 'record-density'
        run: |
          validate_density() {
            python3 scripts/validate-runner-isolation-contract.py \
              --contract density --kind "$1" \
              --min-runners 2 --max-runners 4 --runner-group private
          }
          helm get values "${RELEASE_NAME}" -n arc-runners -o json | validate_density values
          helm get manifest "${RELEASE_NAME}" -n arc-runners | validate_density manifest
          kubectl get autoscalingrunnersets.actions.github.com -n arc-runners -o json \
            | validate_density asrs-list

          HISTORY=$(helm history "${RELEASE_NAME}" -n arc-runners -o json)
          REVISION=$(jq -r --arg version "${ARC_CHART_VERSION}" '
            [.[] | select(.status == "deployed")] as $deployed
            | if ($deployed | length) == 1
                and $deployed[0].chart == ("gha-runner-scale-set-" + $version)
              then $deployed[0].revision | tostring else empty end
          ' <<<"${HISTORY}")
          if ! [[ "${REVISION}" =~ ^[1-9][0-9]*$ ]]; then
            echo "❌ Error: could not identify exactly one deployed ${ARC_CHART_VERSION} revision"
            exit 1
          fi
          helm get values "${RELEASE_NAME}" --revision "${REVISION}" -n arc-runners -o json \
            | validate_density values
          helm get manifest "${RELEASE_NAME}" --revision "${REVISION}" -n arc-runners \
            | validate_density manifest
          # Nothing changed while the revision was read.
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --compare-identities "${RUNNER_TEMP}/pool-identities.json" \
            --transition none
          # Readback (Ruling 27): the recorded revision must still be in helm
          # history. Every Helm write keeps 100 revisions (--history-max 100),
          # so it survives the rollout until Deploy drain and rollback use it.
          HISTORY_AFTER=$(helm history "${RELEASE_NAME}" -n arc-runners -o json)
          if ! jq -e --arg revision "${REVISION}" --arg version "${ARC_CHART_VERSION}" '
            [.[] | select(
              (.revision | tostring) == $revision
              and .chart == ("gha-runner-scale-set-" + $version))] | length == 1
          ' <<<"${HISTORY_AFTER}" >/dev/null; then
            echo "❌ Error: recorded revision ${REVISION} is not in helm history; nothing was recorded"
            exit 1
          fi
          echo "rollback_revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Density rollback target recorded"
            echo ""
            echo "Validated density (2/4) Helm revision: **${REVISION}**"
            echo ""
            echo "Pass it as \`rollback_revision\` to Deploy GitHub Runners \`operation=drain\` and \`operation=rollback\`."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "✅ Recorded density rollback revision ${REVISION}"

      - name: Run acceptance Phase C
        if: steps.validate.outputs.action == 'acceptance-phase-c'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
        run: |
          # PHASE_C_EVIDENCE is unset in CI (evidence lands in the workspace);
          # the offline fixtures point it at a temporary directory.
          EVIDENCE="${PHASE_C_EVIDENCE:-phase-c-evidence.json}"
          # Re-check the SHA immediately before the step that mutates.
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ]; then
            echo "❌ Error: checked-out SHA changed after validation"
            exit 1
          fi
          ./scripts/acceptance-phase-c.sh --max-cycles 3 \
            --identities "${RUNNER_TEMP}/pool-identities.json" \
            --evidence "${EVIDENCE}" 2>&1 | tee "${RUNNER_TEMP}/phase-c.log"
          {
            echo "## Acceptance Phase C"
            echo ""
            grep -E '^PHASE_C_RESULT=' "${RUNNER_TEMP}/phase-c.log"
            echo ""
            echo '```json'
            cat "${EVIDENCE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore burst after Phase C
        if: always() && steps.admit.outputs.cleanup_eligible == 'true'
        run: |
          # Runs on success, failure and cancellation. Re-checks release
          # identity and the live contract, returns burst-acceptance to burst
          # (minRunners=2) and reads back burst; on burst it is a verified
          # no-op. A failed restoration fails the run.
          ./scripts/acceptance-phase-c.sh --restore \
            --identities "${RUNNER_TEMP}/pool-identities.json"

      - name: Upload Phase C evidence
        # runner-acceptance-evidence.yml (phase C) downloads this artifact and
        # adds jobs_killed, which acceptance-phase-c.sh records as null.
        if: always() && steps.admit.outputs.cleanup_eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: phase-c-evidence
          path: phase-c-evidence.json
          if-no-files-found: error
          retention-days: 90
