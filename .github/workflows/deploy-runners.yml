name: Deploy GitHub Runners

# Operations (docs/specs/2026-10-26-runner-burst-autoscaling-design.md,
# "State contract for fleet workflows" and "Rollback"):
#   deploy                  Helm upgrade to the `burst` contract committed in
#                           deploy/dind-values.yaml (admits ARC density or burst)
#   prepare-trust-boundary  runner group reconciliation only
#   drain                   Helm upgrade to the `drain` contract, then retire idle
#                           burst runners until both burst pools reach zero nodes
#   rollback                Helm upgrade to the committed density values
#                           deploy/density-values.yaml (rendered and validated as
#                           density 2/4; independent of Helm history, Ruling 34)
#                           once the burst pools are gone (a no-op on `density`)
#
# Emergency Stop leaves a `stopped` state (a base template at 0/0, Ruling 26)
# and the marker ConfigMap arc-runners/runner-fleet-emergency-stop (Ruling 33).
# While the marker exists the gate refuses every operation here except
# `deploy` and `rollback` dispatched with acknowledge_emergency_stop=true:
# they delete the marker, inside the identity bracket, before their first
# write. `deploy` restores burst from burst-stopped and `rollback` restores
# density from drain-stopped or density-stopped once the burst pools are gone.
# After every Helm write the run re-reads the marker; if a stop is in effect
# it immediately re-applies 0/0 with --reuse-values and fails. Every Helm write
# keeps 100 revisions (--history-max 100).
#
# Server-side fence (Ruling 36): `deploy` and `rollback` install
# deploy/runner-emergency-stop-fence.yaml (server-side dry run compared with the
# file, then a bracketed server-side apply) before their Helm write. While the
# marker exists the API server then denies every AutoscalingRunnerSet write
# that is not 0/0, so a run cancelled after a stale Helm write cannot leave the
# fleet reopened. An acknowledging run waits (dry runs only, up to 30 s) until
# the fence allows a non-zero write after deleting the marker; if it still
# denies, the run fails before writing and is re-dispatched. Every other fleet
# mutator's admission requires the fence to equal the file.
#
# Every run verifies expected_sha first, admits the live state with
# scripts/verify-runner-pool-state.sh --operation <op>, and brackets each Helm
# write with the identity contract: an exact comparison and a fresh admission
# immediately before it, and a comparison that allows only the declared ARC
# transition after it. `deploy` first applies deploy/runner-network-policy.yaml
# (server-side dry run, then a bracketed server-side apply) and requires
# scripts/verify-runner-network-policy.sh to pass before the Helm upgrade.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - prepare-trust-boundary
          - drain
          - rollback
      accept_privileged_runner_co_tenancy:
        description: 'Accept two privileged DinD jobs sharing each runner node'
        required: true
        default: false
        type: boolean
      acknowledge_emergency_stop:
        description: 'deploy/rollback only: recover from an Emergency Stop (deletes its marker before the Helm write)'
        required: false
        default: false
        type: boolean
      expected_sha:
        description: 'Exact commit SHA to deploy'
        required: true
        type: string
      runner_image:
        description: 'Fixed canonical runner image; noncanonical values are rejected'
        required: false
        default: 'registry.digitalocean.com/redducklabs/github-runner:latest'
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'arc-runners'
        type: string

concurrency:
  group: runner-fleet-mutation
  cancel-in-progress: false

env:
  # CLUSTER_NAME is the DigitalOcean cluster NAME (what `doctl kubernetes cluster
  # kubeconfig save` expects). CLUSTER_CONTEXT is the kubeconfig CONTEXT name that
  # doctl generates from it (do-<region>-<cluster-name>) and what
  # `kubectl config use-context` expects. These are DIFFERENT strings and must not
  # be conflated: passing the context name to `kubeconfig save` fails with
  # "no cluster goes by the name ...".
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}
  RELEASE_NAME: ${{ vars.RELEASE_NAME || 'redducklabs-runners' }}
  RUNNER_SCALE_SET_NAME: ${{ vars.RUNNER_SCALE_SET_NAME || 'redducklabs-runners' }}
  REGISTRY: ${{ vars.REGISTRY || 'registry.digitalocean.com' }}
  REPOSITORY: ${{ vars.REPOSITORY || 'redducklabs/github-runner' }}
  CANONICAL_RUNNER_IMAGE: 'registry.digitalocean.com/redducklabs/github-runner:latest'
  # Single pin for BOTH ARC charts. The controller chart
  # (gha-runner-scale-set-controller) and the scale set chart
  # (gha-runner-scale-set) are released together and are expected to run at the
  # same version, so they must not drift apart. Keep this in sync with
  # CHART_VERSION in test/verify-runner-resources.sh.
  ARC_CHART_VERSION: '0.14.2'

# Use minimal permissions
permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate Deployment Inputs
    runs-on: ubuntu-latest
    # Explicit bash runs every step as "bash --noprofile --norc -eo pipefail",
    # so a failing command inside a pipeline fails the step.
    defaults:
      run:
        shell: bash
    outputs:
      operation: ${{ steps.validate.outputs.operation }}
      expected_sha: ${{ steps.validate.outputs.expected_sha }}
      acknowledge_emergency_stop: ${{ steps.validate.outputs.acknowledge_emergency_stop }}
      runner_image: ${{ steps.validate.outputs.runner_image }}
      namespace: ${{ steps.validate.outputs.namespace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and sanitize inputs
        id: validate
        env:
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_RUNNER_IMAGE: ${{ inputs.runner_image }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_ACCEPT_CO_TENANCY: ${{ inputs.accept_privileged_runner_co_tenancy }}
          INPUT_ACKNOWLEDGE_STOP: ${{ inputs.acknowledge_emergency_stop }}
        run: |
          echo "🔍 Validating deployment inputs..."

          NAMESPACE="${INPUT_NAMESPACE}"
          RUNNER_IMAGE="${INPUT_RUNNER_IMAGE}"
          EXPECTED_SHA="${INPUT_EXPECTED_SHA}"
          OPERATION="${INPUT_OPERATION}"
          ACCEPT_CO_TENANCY="${INPUT_ACCEPT_CO_TENANCY}"
          ACKNOWLEDGE_STOP="${INPUT_ACKNOWLEDGE_STOP:-false}"

          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Error: expected_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi

          write_output() {
            local key=$1 value=$2
            if ! [[ "${key}" =~ ^[a-z_]+$ ]] \
               || [[ "${value}" == *$'\r'* || "${value}" == *$'\n'* ]]; then
              echo "❌ Error: refusing unsafe workflow output ${key}"
              return 1
            fi
            printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_OUTPUT}"
          }

          case "${OPERATION}" in
            deploy|prepare-trust-boundary)
              if [ "${ACCEPT_CO_TENANCY}" != "true" ]; then
                echo "❌ Error: privileged runner co-tenancy must be explicitly accepted"
                exit 1
              fi
              ;;
            drain|rollback) ;;
            *)
              echo "❌ Error: operation must be deploy, prepare-trust-boundary, drain, or rollback"
              exit 1
              ;;
          esac

          # Ruling 33: only deploy and rollback may acknowledge an Emergency Stop.
          case "${ACKNOWLEDGE_STOP}" in
            false) ;;
            true)
              if [ "${OPERATION}" != deploy ] && [ "${OPERATION}" != rollback ]; then
                echo "❌ Error: acknowledge_emergency_stop is valid only for deploy and rollback"
                exit 1
              fi
              ;;
            *)
              echo "❌ Error: acknowledge_emergency_stop must be true or false"
              exit 1
              ;;
          esac

          write_output operation "${OPERATION}"
          write_output expected_sha "${EXPECTED_SHA}"
          write_output acknowledge_emergency_stop "${ACKNOWLEDGE_STOP}"

          if [ "${OPERATION}" = "prepare-trust-boundary" ]; then
            echo "✅ Trust-boundary operation and SHA validated"
            exit 0
          fi

          # Runner release ownership and prerequisites are intentionally fixed
          # to the production namespace; reject drift before any mutation.
          if [ "${NAMESPACE}" != "arc-runners" ]; then
            echo "❌ Error: namespace must be exactly arc-runners"
            exit 1
          fi
          write_output namespace "${NAMESPACE}"
          if [ "${OPERATION}" = "rollback" ] || [ "${OPERATION}" = "drain" ]; then
            echo "✅ ${OPERATION} SHA and namespace validated"
            exit 0
          fi

          # Runner bounds are not an input: Deploy renders exactly the burst
          # contract committed in deploy/dind-values.yaml.
          if [ "${RUNNER_IMAGE}" != "${CANONICAL_RUNNER_IMAGE}" ]; then
            echo "❌ Error: runner_image must be the fixed canonical image ${CANONICAL_RUNNER_IMAGE}"
            exit 1
          fi
          write_output runner_image "${RUNNER_IMAGE}"

          echo "✅ All inputs validated successfully"
          echo "  Namespace: ${NAMESPACE}"
          echo "  Runner image: ${RUNNER_IMAGE}"

  trust-boundary:
    name: Prepare Private Runner Trust Boundary
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: >-
      needs.validate-inputs.outputs.operation == 'deploy'
      || needs.validate-inputs.outputs.operation == 'prepare-trust-boundary'
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reconcile trusted runner group
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
        run: |
          # GitHub runner-group endpoint used by the verifier:
          # orgs/redducklabs/actions/runner-groups
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Error: RUNNER_TOKEN secret is not set"
            exit 1
          fi
          bash scripts/verify-runner-trust-boundary.sh \
            --expected-sha "${EXPECTED_SHA}"

  deploy:
    name: Deploy Self-Hosted Runners
    runs-on: ubuntu-latest
    needs: [validate-inputs, trust-boundary]
    if: >-
      always() && needs.validate-inputs.outputs.operation == 'deploy'
      && needs.trust-boundary.result == 'success'
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Validate GitHub Token
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          echo "🔐 Validating GitHub token permissions..."

          # Check if RUNNER_TOKEN secret is set
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Error: RUNNER_TOKEN secret is not set!"
            echo "Please add RUNNER_TOKEN secret with 'admin:org' and 'repo' scopes"
            exit 1
          fi

          # Validate token permissions with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Validating token..."
            if gh api user >/dev/null 2>&1; then
              echo "✅ GitHub token validated successfully"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: RUNNER_TOKEN is invalid, expired, or lacks API access"
              exit 1
            else
              echo "⚠️ Token validation failed, retrying in 5s..."
              sleep 5
            fi
          done

      - name: Configure DigitalOcean access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          echo "🔧 Configuring DigitalOcean access..."
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${DO_TOKEN}" > /dev/null; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done
          # `kubeconfig save` takes the cluster NAME; `use-context` takes the
          # generated CONTEXT name (do-<region>-<cluster-name>) - these differ.
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"
          CURRENT_CONTEXT=$(kubectl config current-context)
          if [ "${CURRENT_CONTEXT}" != "${CLUSTER_CONTEXT}" ]; then
            echo "❌ Error: kubectl context is '${CURRENT_CONTEXT}', expected '${CLUSTER_CONTEXT}'"
            exit 1
          fi
          echo "✅ kubectl context is ${CURRENT_CONTEXT}"

      - name: Admit pool state and record identities
        env:
          ACKNOWLEDGE_STOP: ${{ needs.validate-inputs.outputs.acknowledge_emergency_stop }}
        run: |
          # Deploy admits ARC density, burst or burst-stopped with both burst
          # pools present and the priority expander configured; node headroom
          # is evaluated over every Ready eligible node. While the Emergency
          # Stop marker exists it is admitted only with the acknowledgement.
          ACK=()
          [ "${ACKNOWLEDGE_STOP}" != true ] || ACK=(--acknowledge-emergency-stop)
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation deploy "${ACK[@]}" \
            --emit-identities "${RUNNER_TEMP}/pool-identities.json"

      - name: Verify prepared platform prerequisites
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "🔎 Verifying the existing prepared runner platform..."
          kubectl get namespace "${NAMESPACE}" >/dev/null
          REGISTRY_SECRET=$(kubectl get secret do-registry-secret \
            -n "${NAMESPACE}" -o json)
          if ! jq -e '
            .type == "kubernetes.io/dockerconfigjson"
            and (.data[".dockerconfigjson"] | type == "string" and length > 0)
          ' <<<"${REGISTRY_SECRET}" >/dev/null; then
            echo "❌ Error: do-registry-secret has the wrong type or no Docker config"
            exit 1
          fi
          umask 077
          REGISTRY_CONFIG=$(mktemp "${RUNNER_TEMP}/do-registry-config.XXXXXX")
          trap 'rm -f "${REGISTRY_CONFIG}"' EXIT
          if ! jq -r '.data[".dockerconfigjson"]' <<<"${REGISTRY_SECRET}" \
            | base64 --decode > "${REGISTRY_CONFIG}" \
            || ! jq -e '
              .auths["registry.digitalocean.com"].auth
              | type == "string" and length > 0
            ' "${REGISTRY_CONFIG}" >/dev/null; then
            echo "❌ Error: do-registry-secret lacks valid DigitalOcean registry auth"
            exit 1
          fi
          rm -f "${REGISTRY_CONFIG}"
          trap - EXIT

          # The runner release must already exist (the pool-state gate admitted
          # it) and own its no-permission ServiceAccount.
          if ! SERVICE_ACCOUNT=$(kubectl get serviceaccount \
            redducklabs-runners-gha-rs-no-permission -n "${NAMESPACE}" \
            --ignore-not-found -o json); then
            echo "❌ Error: could not validate runner ServiceAccount ownership"
            exit 1
          fi
          if [ -z "${SERVICE_ACCOUNT}" ]; then
            echo "❌ Error: the chart-owned runner ServiceAccount is missing"
            exit 1
          fi
          if ! jq -e '
            .metadata.labels["app.kubernetes.io/managed-by"] == "Helm"
            and .metadata.annotations["meta.helm.sh/release-name"] == "redducklabs-runners"
            and .metadata.annotations["meta.helm.sh/release-namespace"] == "arc-runners"
          ' <<<"${SERVICE_ACCOUNT}" >/dev/null; then
            echo "❌ Error: existing runner ServiceAccount is not owned by the redducklabs-runners Helm release"
            exit 1
          fi

          CRDS=(
            autoscalinglisteners.actions.github.com
            autoscalingrunnersets.actions.github.com
            ephemeralrunners.actions.github.com
            ephemeralrunnersets.actions.github.com
          )
          for CRD_NAME in "${CRDS[@]}"; do
            if ! CRD=$(kubectl get crd "${CRD_NAME}" -o json) \
              || ! jq -e '
                .status.conditions | any(.type == "Established" and .status == "True")
              ' <<<"${CRD}" >/dev/null; then
              echo "❌ Error: ${CRD_NAME} CRD is missing or not Established"
              exit 1
            fi
          done

          # Scale-set release, controller release and controller readiness:
          # one shared implementation for every fleet workflow.
          # shellcheck source=/dev/null
          source scripts/lib/arc-identity.sh
          if ! verify_arc_identity; then
            echo "❌ Error: ARC release or controller ${ARC_CHART_VERSION} identity check failed"
            exit 1
          fi
          echo "✅ Prepared platform prerequisites are present and Ready"

      - name: Validate committed burst values
        run: |
          # Deploy has no runner-bound inputs: it renders exactly what
          # deploy/dind-values.yaml commits, which must be the burst contract.
          if ! python3 scripts/validate-runner-isolation-contract.py \
            --contract burst --kind values \
            --min-runners 2 --max-runners 20 --runner-group private \
            < deploy/dind-values.yaml; then
            echo "❌ Error: deploy/dind-values.yaml is not the burst contract (2/20); only canonical states can be deployed"
            exit 1
          fi
          echo "✅ deploy/dind-values.yaml is the burst contract (2/20)"

      - name: Render and validate candidate
        if: needs.validate-inputs.outputs.operation == 'deploy'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          RUNNER_IMAGE: ${{ needs.validate-inputs.outputs.runner_image }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          # Local only (Codex PR #35 review 3 finding 1): render, burst-contract
          # validation, the manifest hash gate and the preflight objects. Nothing
          # here reaches the API server, so on an acknowledged recovery it runs
          # before the Emergency Stop marker is deleted; the nonzero ASRS server
          # dry run, which the fence would deny while the marker exists, runs in
          # "Server-side preflight candidate" after the acknowledgement.
          echo "🔬 Rendering and validating the exact deployment candidate..."
          CANDIDATE="${RUNNER_TEMP}/runner-candidate.yaml"
          ASRS="${RUNNER_TEMP}/runner-candidate-asrs.yaml"
          PREFLIGHT_ASRS="${RUNNER_TEMP}/runner-preflight-asrs.yaml"
          ADMITTED_ASRS="${RUNNER_TEMP}/runner-admitted-asrs.json"
          REPRESENTATIVE_POD="${RUNNER_TEMP}/runner-representative-pod.json"
          ADMITTED_POD="${RUNNER_TEMP}/runner-admitted-pod.json"
          CANDIDATE_HASH="${RUNNER_TEMP}/runner-candidate.sha256"
          HASH_GATE="${RUNNER_TEMP}/runner-candidate-hash-gate.sh"
          umask 077

          helm template "${RELEASE_NAME}" \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            --namespace "${NAMESPACE}" \
            --values deploy/dind-values.yaml \
            --set githubConfigSecret.github_token="${RUNNER_TOKEN}" \
            --set runnerScaleSetName="${RUNNER_SCALE_SET_NAME}" \
            --set-string "template.spec.containers[0].image=${RUNNER_IMAGE}" \
            --set-string "template.spec.initContainers[0].image=${RUNNER_IMAGE}" \
            --set runnerGroup=redducklabs-private-runners \
            --set controllerServiceAccount.name=arc-gha-rs-controller \
            --set controllerServiceAccount.namespace=arc-systems \
            --version "${ARC_CHART_VERSION}" > "${CANDIDATE}"

          # The candidate must be exactly the burst contract (2/20) before any
          # admission dry-run or Helm write; non-canonical bounds stop here.
          if ! python3 scripts/validate-runner-isolation-contract.py \
            --contract burst --kind manifest \
            --min-runners 2 --max-runners 20 --runner-group private \
            < "${CANDIDATE}"; then
            echo "❌ Error: rendered candidate does not satisfy the burst contract (2/20)"
            exit 1
          fi

          sha256sum "${CANDIDATE}" | awk '{print $1}' > "${CANDIDATE_HASH}"
          cat > "${HASH_GATE}" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          INPUT=$(mktemp "${RUNNER_TEMP}/helm-postrender.XXXXXX")
          trap 'rm -f "${INPUT}"' EXIT
          cat > "${INPUT}"
          EXPECTED=$(cat "${RUNNER_TEMP}/runner-candidate.sha256")
          ACTUAL=$(sha256sum "${INPUT}" | awk '{print $1}')
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: candidate manifest hash mismatch: expected ${EXPECTED}, got ${ACTUAL}" >&2
            exit 1
          fi
          cat "${INPUT}"
          SH
          chmod 0700 "${HASH_GATE}"

          python3 - "${CANDIDATE}" "${ASRS}" "${PREFLIGHT_ASRS}" <<'PY'
          from copy import deepcopy
          import sys
          import yaml

          source, target, preflight_target = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              matches = [doc for doc in yaml.safe_load_all(stream)
                         if isinstance(doc, dict) and doc.get("kind") == "AutoscalingRunnerSet"]
          if len(matches) != 1:
              raise SystemExit(f"expected one AutoscalingRunnerSet, found {len(matches)}")
          with open(target, "w", encoding="utf-8") as stream:
              yaml.safe_dump(matches[0], stream, sort_keys=False)
          preflight = deepcopy(matches[0])
          preflight["metadata"]["name"] = "redducklabs-runners-compatibility-preflight"
          with open(preflight_target, "w", encoding="utf-8") as stream:
              yaml.safe_dump(preflight, stream, sort_keys=False)
          PY
          echo "✅ Candidate rendered and validated as burst 2/20"

      - name: Acknowledge Emergency Stop
        if: needs.validate-inputs.outputs.acknowledge_emergency_stop == 'true'
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
        run: |
          # Runs after the local render and validation and before any nonzero
          # ASRS server dry run (Codex PR #35 review 3 finding 1).
          # Ruling 33: delete the Emergency Stop marker, bracketed (compare,
          # acknowledged admission, delete with the read uid/resourceVersion as
          # preconditions, compare), before the first write. Later admissions
          # run without the acknowledgement, so a newer stop refuses them.
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA"
            exit 1
          fi
          # shellcheck source=/dev/null
          source scripts/lib/fleet-ops.sh
          fleet_acknowledge_stop "${RUNNER_TEMP}/pool-identities.json" deploy

      - name: Server-side preflight candidate
        if: needs.validate-inputs.outputs.operation == 'deploy'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          RUNNER_IMAGE: ${{ needs.validate-inputs.outputs.runner_image }}
        run: |
          # Server dry runs of the rendered ASRS (as a differently named
          # object) and a representative Pod. The Emergency Stop fence (Ruling
          # 36) judges dry runs like real writes, so on an acknowledged
          # recovery this runs only after "Acknowledge Emergency Stop" deleted
          # the marker and waited until the fence allows nonzero writes. If it
          # fails there, nothing was written to the release: the fleet stays
          # 0/0 without a marker (runbook, "Emergency Stop").
          ASRS="${RUNNER_TEMP}/runner-candidate-asrs.yaml"
          PREFLIGHT_ASRS="${RUNNER_TEMP}/runner-preflight-asrs.yaml"
          ADMITTED_ASRS="${RUNNER_TEMP}/runner-admitted-asrs.json"
          REPRESENTATIVE_POD="${RUNNER_TEMP}/runner-representative-pod.json"
          ADMITTED_POD="${RUNNER_TEMP}/runner-admitted-pod.json"
          umask 077
          for FILE in "${ASRS}" "${PREFLIGHT_ASRS}" "${RUNNER_TEMP}/runner-candidate.sha256"; do
            if [ ! -s "${FILE}" ]; then
              echo "❌ Error: ${FILE} from 'Render and validate candidate' is missing"
              exit 1
            fi
          done

          kubectl apply --server-side --force-conflicts --dry-run=server \
            -f "${PREFLIGHT_ASRS}" -o json > "${ADMITTED_ASRS}"

          python3 - "${ADMITTED_ASRS}" "${ASRS}" "${REPRESENTATIVE_POD}" "${NAMESPACE}" <<'PY'
          import json
          import sys

          import yaml

          source, rendered_path, target, namespace = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              asrs = json.load(stream)
          with open(rendered_path, encoding="utf-8") as stream:
              rendered = yaml.safe_load(stream)
          pod = {
              "apiVersion": "v1",
              "kind": "Pod",
              "metadata": {
                  "name": "runner-compatibility-preflight",
                  "namespace": namespace,
                  "labels": {"actions.github.com/scale-set-name": "redducklabs-runners"},
              },
              "spec": asrs["spec"]["template"]["spec"],
          }
          # ARC copies the template metadata onto every runner Pod, so the
          # representative Pod carries the rendered annotations too.
          annotations = (rendered["spec"]["template"].get("metadata") or {}).get("annotations")
          if annotations is not None:
              pod["metadata"]["annotations"] = dict(annotations)
          with open(target, "w", encoding="utf-8") as stream:
              json.dump(pod, stream)
          PY

          kubectl apply --server-side --force-conflicts --dry-run=server \
            -f "${REPRESENTATIVE_POD}" -o json > "${ADMITTED_POD}"

          python3 - "${ASRS}" "${ADMITTED_ASRS}" "${REPRESENTATIVE_POD}" "${ADMITTED_POD}" "${RUNNER_IMAGE}" <<'PY'
          from copy import deepcopy
          import re
          import sys
          import yaml

          def load(path):
              with open(path, encoding="utf-8") as stream:
                  return yaml.safe_load(stream)

          expected_asrs = load(sys.argv[1])
          asrs = load(sys.argv[2])
          expected_pod = load(sys.argv[3])
          pod = load(sys.argv[4])
          runner_image = sys.argv[5]

          def first_difference(expected, admitted, path="spec"):
              if type(expected) is not type(admitted):
                  return path
              if isinstance(expected, dict):
                  if expected.keys() != admitted.keys():
                      changed_key = sorted(expected.keys() ^ admitted.keys())[0]
                      return f"{path}.{changed_key}"
                  for key in expected:
                      difference = first_difference(
                          expected[key], admitted[key], f"{path}.{key}"
                      )
                      if difference:
                          return difference
              elif isinstance(expected, list):
                  if len(expected) != len(admitted):
                      return path
                  for index, (expected_item, admitted_item) in enumerate(
                      zip(expected, admitted)
                  ):
                      difference = first_difference(
                          expected_item, admitted_item, f"{path}[{index}]"
                      )
                      if difference:
                          return difference
              elif expected != admitted:
                  return path
              return None

          def strip_default(mapping, expected, key, value):
              # Only remove a server-populated field when the submitted object
              # omitted it and the returned value is the documented API default.
              if key not in expected and mapping.get(key) == value:
                  mapping.pop(key)

          def default_pull_policy(image):
              reference = image.rsplit("/", 1)[-1]
              if "@" in reference:
                  return "IfNotPresent"
              if ":" not in reference or reference.rsplit(":", 1)[-1] == "latest":
                  return "Always"
              return "IfNotPresent"

          def canonical_pod_specs(expected, admitted):
              expected = deepcopy(expected)
              admitted = deepcopy(admitted)

              # Kubernetes Pod API defaults explicitly permitted to appear in
              # the server response when absent from the submitted PodSpec.
              pod_defaults = {
                  "dnsPolicy": "ClusterFirst",
                  "enableServiceLinks": True,
                  "hostUsers": True,
                  "preemptionPolicy": "PreemptLowerPriority",
                  "priority": 0,
                  "schedulerName": "default-scheduler",
                  "securityContext": {},
                  "terminationGracePeriodSeconds": 30,
              }
              for key, value in pod_defaults.items():
                  strip_default(admitted, expected, key, value)
              if "serviceAccount" not in expected and "serviceAccount" in admitted \
                 and admitted.get("serviceAccount") == admitted.get("serviceAccountName"):
                  admitted.pop("serviceAccount")

              expected_tolerations = expected.get("tolerations", [])
              default_tolerations = [
                  {"key": "node.kubernetes.io/not-ready", "operator": "Exists",
                   "effect": "NoExecute", "tolerationSeconds": 300},
                  {"key": "node.kubernetes.io/unreachable", "operator": "Exists",
                   "effect": "NoExecute", "tolerationSeconds": 300},
              ]
              admitted["tolerations"] = [
                  item for item in admitted.get("tolerations", [])
                  if item in expected_tolerations or item not in default_tolerations
              ]
              if "tolerations" not in expected and not admitted["tolerations"]:
                  admitted.pop("tolerations")

              for field in ("containers", "initContainers"):
                  expected_items = expected.get(field, [])
                  admitted_items = admitted.get(field, [])
                  if len(expected_items) != len(admitted_items):
                      continue
                  for expected_item, admitted_item in zip(expected_items, admitted_items):
                      container_defaults = {
                          "imagePullPolicy": default_pull_policy(expected_item.get("image", "")),
                          "resources": {},
                          "terminationMessagePath": "/dev/termination-log",
                          "terminationMessagePolicy": "File",
                      }
                      for key, value in container_defaults.items():
                          strip_default(admitted_item, expected_item, key, value)
                      expected_probe = expected_item.get("startupProbe")
                      admitted_probe = admitted_item.get("startupProbe")
                      if isinstance(expected_probe, dict) and isinstance(admitted_probe, dict):
                          if (expected_probe.get("initialDelaySeconds") == 0
                                  and "initialDelaySeconds" not in admitted_probe):
                              expected_probe.pop("initialDelaySeconds")
                          strip_default(
                              admitted_probe, expected_probe, "successThreshold", 1
                          )
                          strip_default(
                              admitted_probe, expected_probe, "timeoutSeconds", 1
                          )
              return expected, admitted

          expected_asrs_spec = deepcopy(expected_asrs.get("spec", {}))
          admitted_asrs_spec = deepcopy(asrs.get("spec", {}))
          expected_template = expected_asrs_spec.get("template", {}).get("spec", {})
          admitted_template = admitted_asrs_spec.get("template", {}).get("spec", {})
          expected_template, admitted_template = canonical_pod_specs(
              expected_template, admitted_template
          )
          expected_asrs_spec["template"]["spec"] = expected_template
          admitted_asrs_spec["template"]["spec"] = admitted_template
          difference = first_difference(expected_asrs_spec, admitted_asrs_spec, "asrs.spec")
          if difference:
              raise SystemExit(f"admission changed an unapproved ASRS field at {difference}")

          expected_pod_spec, admitted_pod_spec = canonical_pod_specs(
              expected_pod.get("spec", {}), pod.get("spec", {})
          )
          difference = first_difference(expected_pod_spec, admitted_pod_spec, "pod.spec")
          if difference:
              raise SystemExit(f"admission changed an unapproved Pod field at {difference}")

          if asrs.get("spec", {}).get("runnerGroup") != "redducklabs-private-runners":
              raise SystemExit("admission changed the named private runner group")
          if asrs.get("spec", {}).get("runnerScaleSetName") != "redducklabs-runners":
              raise SystemExit("admission changed the runner scale-set name")

          required_toleration = {
              "key": "github-runner", "operator": "Equal",
              "value": "true", "effect": "NoSchedule",
          }
          default_toleration_keys = {
              "node.kubernetes.io/not-ready", "node.kubernetes.io/unreachable",
          }

          def validate_tolerations(items):
              if required_toleration not in items:
                  raise SystemExit("admission changed the dedicated-node toleration")
              for item in items:
                  if item == required_toleration:
                      continue
                  if not (
                      item.get("key") in default_toleration_keys
                      and item.get("operator") == "Exists"
                      and item.get("effect") == "NoExecute"
                      and item.get("tolerationSeconds") == 300
                  ):
                      raise SystemExit("admission injected an unexpected toleration")

          def validate_mounts(container, expected):
              actual = {(item.get("name"), item.get("mountPath"))
                        for item in container.get("volumeMounts", [])}
              if not expected.issubset(actual):
                  raise SystemExit(f"admission changed volume wiring for {container.get('name')}")
              extras = actual - expected
              if extras:
                  raise SystemExit(f"admission injected an unexpected mount for {container.get('name')}")

          specs = [asrs["spec"]["template"]["spec"], pod["spec"]]
          for spec in specs:
              resources = spec.get("resources", {})
              if resources.get("requests") != {"cpu": "3", "memory": "5Gi"}:
                  raise SystemExit("admission changed the pod-level requests")
              if resources.get("limits") != {"memory": "6Gi"}:
                  raise SystemExit("admission changed the pod-level limits")
              if spec.get("nodeSelector") != {"node-type": "github-runner"}:
                  raise SystemExit("admission changed the dedicated runner node selector")
              validate_tolerations(spec.get("tolerations", []))
              if spec.get("restartPolicy") != "Never":
                  raise SystemExit("admission changed the Pod restart policy")
              if spec.get("serviceAccountName") != "redducklabs-runners-gha-rs-no-permission":
                  raise SystemExit("admission changed the no-permission runner service account")
              if spec.get("automountServiceAccountToken") is not False:
                  raise SystemExit("runner service-account token automount is not disabled")
              if spec.get("imagePullSecrets") != [{"name": "do-registry-secret"}]:
                  raise SystemExit("admission changed the private registry pull secret")

              app_containers = spec.get("containers", [])
              init_containers = spec.get("initContainers", [])
              if [item.get("name") for item in app_containers] != ["runner"]:
                  raise SystemExit("admission changed the exact runner container set")
              if [item.get("name") for item in init_containers] != ["init-dind-externals", "dind"]:
                  raise SystemExit("admission changed the exact init/native-sidecar set")
              containers = list(app_containers) + list(init_containers)
              by_name = {container.get("name"): container for container in containers}
              for name in ("runner", "dind"):
                  budget = by_name[name].get("resources") or {}
                  if budget.get("requests") or budget.get("limits"):
                      raise SystemExit(f"admission injected a competing {name} resource budget")

              runner = by_name["runner"]
              dind = by_name["dind"]
              externals = by_name["init-dind-externals"]
              if runner.get("image") != runner_image or externals.get("image") != runner_image:
                  raise SystemExit("admission changed the pinned runner image")
              if dind.get("image") != "docker:29.7.2-dind":
                  raise SystemExit("admission changed the pinned DinD image")
              if dind.get("securityContext", {}).get("privileged") is not True:
                  raise SystemExit("admission removed the accepted privileged DinD setting")
              if runner.get("securityContext") != {
                  "runAsUser": 1001, "runAsGroup": 121,
                  "allowPrivilegeEscalation": True, "readOnlyRootFilesystem": False,
              }:
                  raise SystemExit("admission changed the runner security context")
              if by_name["dind"].get("restartPolicy") != "Always":
                  raise SystemExit("admission removed native-sidecar restartPolicy")
              if runner.get("command") != ["/home/runner/run.sh"]:
                  raise SystemExit("admission changed the runner entrypoint")
              if {(item.get("name"), item.get("value")) for item in runner.get("env", [])} != {
                  ("DOCKER_HOST", "unix:///var/run/docker.sock"),
                  ("RUNNER_WAIT_FOR_DOCKER_IN_SECONDS", "120"),
                  ("RUNNER_TOOL_CACHE", "/opt/hostedtoolcache"),
                  ("AGENT_TOOLSDIRECTORY", "/opt/hostedtoolcache"),
              }:
                  raise SystemExit("admission changed runner/DinD coordination")
              if dind.get("args") != [
                  "dockerd", "--host=unix:///var/run/docker.sock", "--group=$(DOCKER_GROUP_GID)",
                  "--registry-mirror=https://mirror.gcr.io",
              ]:
                  raise SystemExit("admission changed the DinD socket/group arguments")
              if dind.get("env") != [{"name": "DOCKER_GROUP_GID", "value": "123"}]:
                  raise SystemExit("admission changed the DinD group identity")

              # The tool cache must be the same volume at the same path in the
              # runner and dind: container jobs bind-mount it through dockerd.
              validate_mounts(runner, {
                  ("work", "/home/runner/_work"), ("dind-sock", "/var/run"),
                  ("tool-cache", "/opt/hostedtoolcache"),
              })
              validate_mounts(dind, {
                  ("work", "/home/runner/_work"), ("dind-sock", "/var/run"),
                  ("dind-externals", "/home/runner/externals"),
                  ("tool-cache", "/opt/hostedtoolcache"),
              })
              validate_mounts(externals, {("dind-externals", "/home/runner/tmpDir")})
              volumes = spec.get("volumes", [])
              if any(
                  "serviceAccountToken" in source
                  for volume in volumes
                  for source in volume.get("projected", {}).get("sources", [])
              ):
                  raise SystemExit("admission injected a service-account token volume")
              if any(
                  mount.get("mountPath") == "/var/run/secrets/kubernetes.io/serviceaccount"
                  for container in containers
                  for mount in container.get("volumeMounts", [])
              ):
                  raise SystemExit("admission injected a service-account token mount")
              expected_volumes = {"work", "dind-sock", "dind-externals", "tool-cache"}
              for volume in volumes:
                  name = volume.get("name")
                  if name in expected_volumes:
                      if volume.get("emptyDir") != {}:
                          raise SystemExit(f"admission changed emptyDir volume {name}")
                  else:
                      raise SystemExit("admission injected an unexpected volume")
              if not expected_volumes.issubset({item.get("name") for item in volumes}):
                  raise SystemExit("admission removed required runner/DinD volumes")
          if pod.get("metadata", {}).get("labels", {}).get(
              "actions.github.com/scale-set-name"
          ) != "redducklabs-runners":
              raise SystemExit("admission changed the representative Pod scale-set label")

          safe_to_evict = "cluster-autoscaler.kubernetes.io/safe-to-evict"
          expected_annotations = (
              expected_asrs.get("spec", {}).get("template", {}).get("metadata") or {}
          ).get("annotations") or {}
          if expected_annotations.get(safe_to_evict) != "false":
              raise SystemExit("rendered candidate lacks the safe-to-evict annotation")
          for label, annotations in (
              ("ASRS template", (asrs["spec"]["template"].get("metadata") or {}).get("annotations") or {}),
              ("representative Pod", (pod.get("metadata") or {}).get("annotations") or {}),
          ):
              if annotations.get(safe_to_evict) != "false":
                  raise SystemExit(f"admission removed or changed the safe-to-evict annotation on the {label}")
              if annotations != expected_annotations:
                  raise SystemExit(f"admission changed the {label} annotations")
          PY

          SERVER_VERSION=$(kubectl version -o json)
          SERVER_MAJOR=$(jq -r '.serverVersion.major' <<<"${SERVER_VERSION}" | sed 's/[^0-9].*$//')
          SERVER_MINOR=$(jq -r '.serverVersion.minor' <<<"${SERVER_VERSION}" | sed 's/[^0-9].*$//')
          if ! [[ "${SERVER_MAJOR}" =~ ^[0-9]+$ ]] \
             || ! [[ "${SERVER_MINOR}" =~ ^[0-9]+$ ]] \
             || [ "${SERVER_MAJOR}" -lt 1 ] \
             || { [ "${SERVER_MAJOR}" -eq 1 ] && [ "${SERVER_MINOR}" -lt 36 ]; }; then
            echo "❌ Error: Kubernetes API server 1.36 or newer is required"
            exit 1
          fi

          # Node headroom is checked by scripts/verify-runner-pool-state.sh over
          # every Ready eligible node for a 3 CPU / 5Gi runner Pod, so the
          # admitted representative Pod must request exactly that.
          python3 - "${ADMITTED_POD}" <<'PY'
          import json
          import math
          import re
          import sys
          from decimal import Decimal

          (admitted_path,) = sys.argv[1:]
          with open(admitted_path, encoding="utf-8") as stream:
              proposed = json.load(stream)

          def cpu_m(value):
              value = str(value or "0")
              if value.endswith("n"):
                  milli = Decimal(value[:-1]) / Decimal(1_000_000)
              elif value.endswith("u"):
                  milli = Decimal(value[:-1]) / Decimal(1_000)
              elif value.endswith("m"):
                  milli = Decimal(value[:-1])
              else:
                  milli = Decimal(value) * Decimal(1000)
              return math.ceil(milli)

          def memory_mi(value):
              value = str(value or "0")
              match = re.fullmatch(r"([0-9.]+)([KMGT]i?|)", value)
              if not match:
                  raise ValueError(f"unsupported memory quantity {value}")
              amount = float(match.group(1))
              unit = match.group(2)
              factors = {"": 1 / 1024 / 1024, "K": 1000 / 1024 / 1024,
                         "Ki": 1 / 1024, "M": 1000**2 / 1024**2, "Mi": 1,
                         "G": 1000**3 / 1024**2, "Gi": 1024,
                         "T": 1000**4 / 1024**2, "Ti": 1024**2}
              return math.ceil(amount * factors[unit])

          def requests(pod):
              spec = pod.get("spec", {})
              pod_requests = spec.get("resources", {}).get("requests", {})
              app_cpu = sum(cpu_m(item.get("resources", {}).get("requests", {}).get("cpu"))
                            for item in spec.get("containers", []))
              app_memory = sum(memory_mi(item.get("resources", {}).get("requests", {}).get("memory"))
                               for item in spec.get("containers", []))
              sidecar_cpu = sidecar_memory = 0
              init_peak_cpu = init_peak_memory = 0
              for init in spec.get("initContainers", []):
                  init_cpu = cpu_m(init.get("resources", {}).get("requests", {}).get("cpu"))
                  init_memory = memory_mi(init.get("resources", {}).get("requests", {}).get("memory"))
                  if init.get("restartPolicy") == "Always":
                      sidecar_cpu += init_cpu
                      sidecar_memory += init_memory
                      init_peak_cpu = max(init_peak_cpu, sidecar_cpu)
                      init_peak_memory = max(init_peak_memory, sidecar_memory)
                  else:
                      init_peak_cpu = max(init_peak_cpu, sidecar_cpu + init_cpu)
                      init_peak_memory = max(init_peak_memory, sidecar_memory + init_memory)
              container_cpu = max(app_cpu + sidecar_cpu, init_peak_cpu)
              container_memory = max(app_memory + sidecar_memory, init_peak_memory)
              cpu = max(cpu_m(pod_requests["cpu"]), container_cpu) if "cpu" in pod_requests else container_cpu
              memory = max(memory_mi(pod_requests["memory"]), container_memory) if "memory" in pod_requests else container_memory
              overhead = spec.get("overhead", {})
              return cpu + cpu_m(overhead.get("cpu")), memory + memory_mi(overhead.get("memory"))

          proposed_cpu, proposed_memory = requests(proposed)
          if (proposed_cpu, proposed_memory) != (3000, 5120):
              raise SystemExit("admitted representative Pod request changed")
          PY
          echo "✅ Live API compatibility and admitted-request preflight passed"

      - name: Dry-run Emergency Stop fence
        run: |
          # Ruling 36 (spec "Emergency Stop fence"): the server-side fence
          # deploy/runner-emergency-stop-fence.yaml (a ValidatingAdmissionPolicy
          # and its binding) is installed before the Helm upgrade. The API
          # server validates both objects first, and the objects it would store
          # must keep the file's specs exactly, so a spec the server would
          # default or rewrite fails here, before anything is applied.
          # shellcheck source=/dev/null
          source scripts/lib/fleet-ops.sh
          fleet_fence_dry_run

      - name: Apply Emergency Stop fence
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
        run: |
          # Re-check the SHA in this job, immediately before the step that mutates.
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          # Identity bracket (compare none, re-admit deploy, server-side apply,
          # compare none), then the live specs must equal the file and the
          # policy must be type checked without expression warnings. No retry:
          # a second apply would run outside the identity bracket.
          # shellcheck source=/dev/null
          source scripts/lib/fleet-ops.sh
          fleet_install_fence "${RUNNER_TEMP}/pool-identities.json" deploy
          echo "✅ Emergency Stop fence applied"

      - name: Dry-run runner network policy
        run: |
          # Runner network isolation (spec "Runner network isolation"): the
          # API server validates the exact object before anything is written,
          # and the object it would store must keep the file's spec exactly.
          # The post-apply policy-set validation requires that equality, so a
          # spec the server would default or rewrite fails here, before the
          # policy lands, instead of after it.
          DRY_RUN="${RUNNER_TEMP}/runner-network-policy-dry-run.json"
          kubectl apply --server-side --dry-run=server -f deploy/runner-network-policy.yaml \
            --field-manager=redducklabs-runner-deploy -o json > "${DRY_RUN}"
          python3 - "${DRY_RUN}" deploy/runner-network-policy.yaml <<'PY'
          import difflib
          import json
          import sys

          import yaml

          with open(sys.argv[1], encoding="utf-8") as stream:
              returned = json.load(stream)
          with open(sys.argv[2], encoding="utf-8") as stream:
              committed = yaml.safe_load(stream)
          if not isinstance(returned, dict) or returned.get("kind") != "NetworkPolicy":
              raise SystemExit("❌ Error: the server dry run did not return one NetworkPolicy")
          if returned.get("spec") != committed["spec"]:
              diff = difflib.unified_diff(
                  json.dumps(committed["spec"], indent=2, sort_keys=True).splitlines(),
                  json.dumps(returned.get("spec"), indent=2, sort_keys=True).splitlines(),
                  "deploy/runner-network-policy.yaml spec", "server dry-run spec", lineterm="")
              print("\n".join(diff))
              raise SystemExit("❌ Error: the server would store a different runner NetworkPolicy spec; nothing was applied")
          PY
          echo "✅ Runner network policy passed the server-side dry run with its spec unchanged"

      - name: Apply runner network policy
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
        run: |
          # Re-check the SHA in this job, immediately before the step that mutates.
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          # Identity bracket, part 1: live identities must still equal the
          # admission snapshot, and deploy must still be admitted.
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --compare-identities "${RUNNER_TEMP}/pool-identities.json" \
            --transition none
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation deploy
          # No retry: a second attempt would run outside the identity bracket.
          kubectl apply --server-side -f deploy/runner-network-policy.yaml \
            --field-manager=redducklabs-runner-deploy
          # Identity bracket, part 2: the policy is not part of the identity
          # snapshot, so the apply declares no transition and every identity
          # must still equal the snapshot.
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --compare-identities "${RUNNER_TEMP}/pool-identities.json" \
            --transition none
          echo "✅ Runner network policy applied"

      - name: Verify runner network policy set
        run: |
          # Policies are additive for allows: validate every policy that can
          # apply to runner pods, not only the object just applied. A failure
          # stops the run before the Helm upgrade.
          ./scripts/verify-runner-network-policy.sh

      - name: Re-admit immediately before Helm
        run: |
          # Identity bracket, part 1: live identities must still equal the
          # admission snapshot, and deploy must still be admitted.
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --compare-identities "${RUNNER_TEMP}/pool-identities.json" \
            --transition none
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation deploy

      - name: Deploy runners
        if: needs.validate-inputs.outputs.operation == 'deploy'
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          RUNNER_IMAGE: ${{ needs.validate-inputs.outputs.runner_image }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          # Re-check the SHA in this job, immediately before the step that mutates.
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          echo "🚀 Deploying GitHub runners..."
          HASH_GATE="${RUNNER_TEMP}/runner-candidate-hash-gate.sh"
          if [ ! -x "${HASH_GATE}" ]; then
            echo "❌ Error: preflight candidate hash gate is unavailable"
            exit 1
          fi

          # Source of truth is the committed deploy/dind-values.yaml (bounds,
          # affinity, annotation, tolerations, resources, securityContext). Only
          # secrets and the fixed image/group/controller identities are overlaid
          # via --set. The post-renderer refuses any manifest other than the
          # preflighted candidate. There is no retry: a second attempt would run
          # outside the identity bracket, so a failure stops here for review.
          # The Emergency Stop fence (Ruling 33) runs after the write whether
          # or not Helm reported success.
          # shellcheck source=/dev/null
          source scripts/lib/fleet-ops.sh
          HELM_RC=0
          helm upgrade "${RELEASE_NAME}" \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            --namespace "${NAMESPACE}" \
            --values deploy/dind-values.yaml \
            --set githubConfigSecret.github_token="${RUNNER_TOKEN}" \
            --set runnerScaleSetName="${RUNNER_SCALE_SET_NAME}" \
            --set-string "template.spec.containers[0].image=${RUNNER_IMAGE}" \
            --set-string "template.spec.initContainers[0].image=${RUNNER_IMAGE}" \
            --set runnerGroup=redducklabs-private-runners \
            --set controllerServiceAccount.name=arc-gha-rs-controller \
            --set controllerServiceAccount.namespace=arc-systems \
            --version "${ARC_CHART_VERSION}" \
            --post-renderer "${HASH_GATE}" \
            --history-max 100 \
            --wait \
            --timeout 300s || HELM_RC=$?
          if ! fleet_stop_fence; then
            echo "❌ Error: an Emergency Stop is in effect; the stop was re-applied (0/0) and this deploy failed"
            exit 1
          fi
          if [ "${HELM_RC}" -ne 0 ]; then
            echo "❌ Error: Failed to deploy runners"
            helm status "${RELEASE_NAME}" -n "${NAMESPACE}" || true
            exit 1
          fi
          echo "✅ Runners deployed successfully"

      - name: Verify Helm transition and burst readback
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          # Identity bracket, part 2: only the ARC state may have changed, and
          # only to burst 2/20.
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --compare-identities "${RUNNER_TEMP}/pool-identities.json" \
            --transition arc:burst:2/20
          validate_burst() {
            python3 scripts/validate-runner-isolation-contract.py \
              --contract burst --kind "$1" \
              --min-runners 2 --max-runners 20 --runner-group private
          }
          helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json | validate_burst values
          helm get manifest "${RELEASE_NAME}" -n "${NAMESPACE}" | validate_burst manifest
          kubectl get autoscalingrunnersets.actions.github.com -n "${NAMESPACE}" -o json \
            | validate_burst asrs-list
          echo "✅ Helm values, manifest and live AutoscalingRunnerSet read back as burst 2/20"

      - name: Verify deployment
        if: needs.validate-inputs.outputs.operation == 'deploy'
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
        run: |
          echo "✅ Deployment complete! Checking runner status..."
          echo ""
          echo "📊 Runner pods:"
          kubectl get pods -n "${NAMESPACE}" -l actions.github.com/scale-set-name="${RELEASE_NAME}"
          echo ""
          echo "🎯 To use these runners in your workflows, add:"
          echo "  runs-on: ${RUNNER_SCALE_SET_NAME}"

      - name: Check GitHub registration
        if: needs.validate-inputs.outputs.operation == 'deploy'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          echo ""
          echo "🔍 Checking GitHub registration..."
          for attempt in 1 2 3; do
            if RESPONSE=$(gh api --paginate --slurp "orgs/${ORG}/actions/runners?per_page=100" 2>/dev/null); then
              RUNNERS=$(jq '[.[]?.runners[]?] | length' <<<"${RESPONSE}" 2>/dev/null || echo 0)
              if [ "${RUNNERS}" != "null" ] && [ "${RUNNERS}" != "0" ]; then
                echo "✅ Found ${RUNNERS} runner(s) registered with GitHub"
                break
              fi
            fi
            if [ "${attempt}" = "3" ]; then
              echo "⚠️ Could not verify GitHub registration (may take a few minutes to appear)"
            else
              echo "Retrying GitHub API check..."
              sleep 5
            fi
          done

      - name: Remove rendered candidate files
        if: always()
        run: |
          rm -f \
            "${RUNNER_TEMP}/runner-candidate.yaml" \
            "${RUNNER_TEMP}/runner-candidate-asrs.yaml" \
            "${RUNNER_TEMP}/runner-preflight-asrs.yaml" \
            "${RUNNER_TEMP}/runner-admitted-asrs.json" \
            "${RUNNER_TEMP}/runner-representative-pod.json" \
            "${RUNNER_TEMP}/runner-admitted-pod.json" \
            "${RUNNER_TEMP}/runner-candidate.sha256" \
            "${RUNNER_TEMP}/runner-candidate-hash-gate.sh" \
            "${RUNNER_TEMP}"/helm-postrender.*

      - name: Summary
        if: always()
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          RUNNER_IMAGE: ${{ needs.validate-inputs.outputs.runner_image }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" != "success" ]; then
            {
              echo "## ❌ Runner deploy failed"
              echo "Review the logs: a prior mutation in this job may already have completed."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "## 🎉 Deployment Summary"
            echo ""
            echo "✅ **Deployed the burst contract (minRunners 2, maxRunners 20)**"
            echo ""
            echo "- **Runner Label**: \`${RUNNER_SCALE_SET_NAME}\`"
            echo "- **Namespace**: \`${NAMESPACE}\`"
            echo "- **Image**: \`${RUNNER_IMAGE}\`"
            echo ""
            echo "Next: Node Pool Sizing \`enable-burst\` opens the burst pools."
          } >> "${GITHUB_STEP_SUMMARY}"

  drain:
    name: Drain Burst Runners
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: needs.validate-inputs.outputs.operation == 'drain'
    # The drain wait stops at 300 minutes; this leaves time for setup and
    # summary inside GitHub-hosted runners' six-hour job limit.
    timeout-minutes: 330
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Configure DigitalOcean access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi
          doctl auth init --access-token "${DO_TOKEN}" > /dev/null
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"
          CURRENT_CONTEXT=$(kubectl config current-context)
          if [ "${CURRENT_CONTEXT}" != "${CLUSTER_CONTEXT}" ]; then
            echo "❌ Error: kubectl context is '${CURRENT_CONTEXT}', expected '${CLUSTER_CONTEXT}'"
            exit 1
          fi
          echo "✅ kubectl context is ${CURRENT_CONTEXT}"

      - name: Admit pool state and record identities
        run: |
          # Drain admits ARC burst, an interrupted Phase C (burst-acceptance
          # 8/20 or 4/20), drain itself (a retry), or burst-stopped (Emergency
          # Stop from burst), with both burst pools.
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation drain \
            --emit-identities "${RUNNER_TEMP}/pool-identities.json"

      - name: Drain runners
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          # Re-check the SHA immediately before the step that mutates.
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ]; then
            echo "❌ Error: checked-out SHA changed after validation"
            exit 1
          fi
          ./scripts/drain-runners.sh --identities "${RUNNER_TEMP}/pool-identities.json" \
            2>&1 | tee "${RUNNER_TEMP}/drain.log"

      - name: Drain summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          LOG="${RUNNER_TEMP}/drain.log"
          {
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "## ✅ Runner drain complete"
              echo "ARC is \`drain\` (maxRunners 4, required baseline affinity); no runner pod is on a burst node and both burst pools are at zero nodes."
              echo "Next: Node Pool Sizing \`remove-burst\`, then Deploy \`rollback\` (upgrades to the committed \`deploy/density-values.yaml\`)."
            else
              echo "## ❌ Runner drain did not finish"
              echo "The fleet is left in its current state (\`drain\` once the Helm upgrade succeeded); re-run \`drain\` to resume the wait."
            fi
            if [ -f "${LOG}" ]; then
              echo ""
              echo '```'
              grep -E '^(PLAN|NOOP|HELM|READBACK|WAIT|DRAIN_COMPLETE|ERROR|STOP_MARKER):' "${LOG}" | tail -n 20 || true
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  rollback:
    name: Roll Back Self-Hosted Runners
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: needs.validate-inputs.outputs.operation == 'rollback'
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Configure rollback cluster access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set"
            exit 1
          fi
          doctl auth init --access-token "${DO_TOKEN}" > /dev/null
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"
          CURRENT_CONTEXT=$(kubectl config current-context)
          if [ "${CURRENT_CONTEXT}" != "${CLUSTER_CONTEXT}" ]; then
            echo "❌ Error: kubectl context is '${CURRENT_CONTEXT}', expected '${CLUSTER_CONTEXT}'"
            exit 1
          fi
          echo "✅ kubectl context is ${CURRENT_CONTEXT}"

      - name: Validate GitHub Token
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          # The density release is rendered with RUNNER_TOKEN exactly as Deploy
          # renders burst (githubConfigSecret.github_token).
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Error: RUNNER_TOKEN secret is not set!"
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh api user >/dev/null 2>&1; then
              echo "✅ GitHub token validated successfully"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: RUNNER_TOKEN is invalid, expired, or lacks API access"
              exit 1
            else
              sleep 5
            fi
          done

      - name: Admit rollback state and record identities
        id: admit
        env:
          ACKNOWLEDGE_STOP: ${{ needs.validate-inputs.outputs.acknowledge_emergency_stop }}
        run: |
          # Rollback admits ARC drain or density, or the stopped states
          # drain-stopped and density-stopped that Emergency Stop leaves, and
          # only with every burst pool already removed. While the Emergency
          # Stop marker exists it is admitted only with the acknowledgement.
          ACK=()
          [ "${ACKNOWLEDGE_STOP}" != true ] || ACK=(--acknowledge-emergency-stop)
          STATE=$(./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation rollback "${ACK[@]}" \
            --emit-identities "${RUNNER_TEMP}/pool-identities.json")
          echo "${STATE}"
          STATE=$(grep -E '^STATE: ' <<<"${STATE}")
          case "${STATE}" in
            "STATE: arc=density "*) printf 'arc_state=density\n' >> "${GITHUB_OUTPUT}" ;;
            "STATE: arc=drain "*) printf 'arc_state=drain\n' >> "${GITHUB_OUTPUT}" ;;
            "STATE: arc=drain-stopped "*) printf 'arc_state=drain-stopped\n' >> "${GITHUB_OUTPUT}" ;;
            "STATE: arc=density-stopped "*) printf 'arc_state=density-stopped\n' >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "❌ Error: unexpected admitted state '${STATE}'"
              exit 1
              ;;
          esac

      - name: Roll back to committed density values
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          ACKNOWLEDGE_STOP: ${{ needs.validate-inputs.outputs.acknowledge_emergency_stop }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          # Ruling 34: the target is deploy/density-values.yaml, validated as
          # density 2/4 (values and rendered manifest) before the bracketed
          # Helm upgrade; the Emergency Stop fence runs after the write.
          ACK=()
          [ "${ACKNOWLEDGE_STOP}" != true ] || ACK=(--acknowledge-emergency-stop)
          ./scripts/rollback-density.sh --identities "${RUNNER_TEMP}/pool-identities.json" "${ACK[@]}" \
            2>&1 | tee "${RUNNER_TEMP}/rollback.log"

      - name: Verify rollback transition and density readback
        env:
          NAMESPACE: ${{ needs.validate-inputs.outputs.namespace }}
          ARC_STATE: ${{ steps.admit.outputs.arc_state }}
        run: |
          TRANSITION=none
          if [ "${ARC_STATE}" != "density" ]; then
            TRANSITION=arc:density:2/4
          fi
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --compare-identities "${RUNNER_TEMP}/pool-identities.json" \
            --transition "${TRANSITION}"
          validate_density() {
            python3 scripts/validate-runner-isolation-contract.py \
              --contract density --kind "$1" \
              --min-runners 2 --max-runners 4 --runner-group private
          }
          helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json | validate_density values
          helm get manifest "${RELEASE_NAME}" -n "${NAMESPACE}" | validate_density manifest
          kubectl get autoscalingrunnersets.actions.github.com -n "${NAMESPACE}" -o json \
            | validate_density asrs-list
          echo "✅ Helm values, manifest and live AutoscalingRunnerSet read back as density 2/4"

      - name: Verify pool state after rollback
        run: |
          STATE=$(./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation rollback)
          echo "${STATE}"
          # The postcondition is the density readback (previous step) and no
          # burst pools. A runner pod that is momentarily Pending while ARC
          # replaces a runner is not a failure: with no burst pools it can only
          # schedule on baseline.
          if [ "${STATE}" != "STATE: arc=density pools=none burst=closed" ]; then
            echo "❌ Error: post-rollback pool state is not density with no burst pools"
            exit 1
          fi
          echo "✅ Post-rollback pool state is density with no burst pools"

      - name: Verify trust boundary after rollback
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
        run: |
          bash scripts/verify-runner-trust-boundary.sh \
            --expected-sha "${EXPECTED_SHA}" --verify-only

      - name: Rollback summary
        if: always()
        env:
          ARC_STATE: ${{ steps.admit.outputs.arc_state }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            if [ "${JOB_STATUS}" = "success" ] && [ "${ARC_STATE}" = "density" ]; then
              echo "## ✅ Runner rollback: already density (no-op)"
            elif [ "${JOB_STATUS}" = "success" ]; then
              echo "## ✅ Runner rollback complete"
              echo "- **Values**: \`deploy/density-values.yaml\` (density 2/4)"
              echo "- **Runner Group**: \`redducklabs-private-runners\`"
            else
              echo "## ❌ Runner rollback or post-rollback verification failed"
              echo "Review the logs: the Helm upgrade may have completed before a verification failure. A \`STOP_FENCE\` error means an Emergency Stop is in effect and 0/0 was re-applied."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
