name: Deploy GitHub Runners

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - prepare-trust-boundary
          - rollback
      accept_privileged_runner_co_tenancy:
        description: 'Accept two privileged DinD jobs sharing each runner node'
        required: true
        default: false
        type: boolean
      rollback_revision:
        description: 'Recorded post-quiesce Helm revision (rollback only)'
        required: false
        default: ''
        type: string
      min_runners:
        description: 'Minimum number of runners'
        required: false
        default: '2'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
      max_runners:
        description: 'Maximum number of runners'
        required: false
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
      expected_sha:
        description: 'Exact commit SHA to deploy'
        required: true
        type: string
      runner_image:
        description: 'Runner image to deploy'
        required: false
        default: 'registry.digitalocean.com/redducklabs/github-runner:latest'
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'arc-runners'
        type: string

env:
  # CLUSTER_NAME is the DigitalOcean cluster NAME (what `doctl kubernetes cluster
  # kubeconfig save` expects). CLUSTER_CONTEXT is the kubeconfig CONTEXT name that
  # doctl generates from it (do-<region>-<cluster-name>) and what
  # `kubectl config use-context` expects. These are DIFFERENT strings and must not
  # be conflated: passing the context name to `kubeconfig save` fails with
  # "no cluster goes by the name ...".
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}
  RELEASE_NAME: ${{ vars.RELEASE_NAME || 'redducklabs-runners' }}
  RUNNER_SCALE_SET_NAME: ${{ vars.RUNNER_SCALE_SET_NAME || 'redducklabs-runners' }}
  REGISTRY: ${{ vars.REGISTRY || 'registry.digitalocean.com' }}
  REPOSITORY: ${{ vars.REPOSITORY || 'redducklabs/github-runner' }}
  # Single pin for BOTH ARC charts. The controller chart
  # (gha-runner-scale-set-controller) and the scale set chart
  # (gha-runner-scale-set) are released together and are expected to run at the
  # same version, so they must not drift apart. Keep this in sync with
  # CHART_VERSION in test/verify-runner-resources.sh.
  ARC_CHART_VERSION: '0.14.2'

# Use minimal permissions
permissions:
  contents: read
  id-token: write

jobs:
  validate-inputs:
    name: Validate Deployment Inputs
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.validate.outputs.operation }}
      rollback_revision: ${{ steps.validate.outputs.rollback_revision }}
      min_runners: ${{ steps.validate.outputs.min_runners }}
      max_runners: ${{ steps.validate.outputs.max_runners }}
      runner_image: ${{ steps.validate.outputs.runner_image }}
      namespace: ${{ steps.validate.outputs.namespace }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and sanitize inputs
        id: validate
        run: |
          echo "🔍 Validating deployment inputs..."
          
          # Validate numeric inputs
          MIN_RUNNERS="${{ github.event.inputs.min_runners }}"
          MAX_RUNNERS="${{ github.event.inputs.max_runners }}"
          NAMESPACE="${{ github.event.inputs.namespace }}"
          RUNNER_IMAGE="${{ github.event.inputs.runner_image }}"
          EXPECTED_SHA="${{ github.event.inputs.expected_sha }}"
          OPERATION="${{ github.event.inputs.operation }}"
          ACCEPT_CO_TENANCY="${{ github.event.inputs.accept_privileged_runner_co_tenancy }}"
          ROLLBACK_REVISION="${{ github.event.inputs.rollback_revision }}"

          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Error: expected_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi

          case "${OPERATION}" in
            deploy|prepare-trust-boundary)
              if [ "${ACCEPT_CO_TENANCY}" != "true" ]; then
                echo "❌ Error: privileged runner co-tenancy must be explicitly accepted"
                exit 1
              fi
              ;;
            rollback)
              if ! [[ "${ROLLBACK_REVISION}" =~ ^[1-9][0-9]*$ ]]; then
                echo "❌ Error: rollback_revision must be a positive Helm revision"
                exit 1
              fi
              ;;
            *)
              echo "❌ Error: operation must be deploy, prepare-trust-boundary, or rollback"
              exit 1
              ;;
          esac
          
          # Validate min_runners is numeric
          if ! [[ "${MIN_RUNNERS}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: min_runners must be a number"
            exit 1
          fi
          
          # Validate max_runners is numeric
          if ! [[ "${MAX_RUNNERS}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: max_runners must be a number"
            exit 1
          fi
          
          # Validate min <= max
          if [ "${MIN_RUNNERS}" -gt "${MAX_RUNNERS}" ]; then
            echo "❌ Error: min_runners (${MIN_RUNNERS}) cannot be greater than max_runners (${MAX_RUNNERS})"
            exit 1
          fi

          if [ "${MAX_RUNNERS}" -gt 4 ]; then
            echo "❌ Error: max_runners must not exceed the fixed capacity ceiling of 4"
            exit 1
          fi
          
          # Validate namespace format (DNS-1123 label)
          if ! [[ "${NAMESPACE}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "❌ Error: namespace must be a valid DNS-1123 label"
            exit 1
          fi
          
          # Validate runner image format
          if ! [[ "${RUNNER_IMAGE}" =~ ^[a-z0-9._/-]+:[a-z0-9._-]+$ ]]; then
            echo "❌ Error: runner_image must be a valid container image reference"
            exit 1
          fi
          
          # Set validated outputs
          echo "operation=${OPERATION}" >> $GITHUB_OUTPUT
          echo "rollback_revision=${ROLLBACK_REVISION}" >> $GITHUB_OUTPUT
          echo "min_runners=${MIN_RUNNERS}" >> $GITHUB_OUTPUT
          echo "max_runners=${MAX_RUNNERS}" >> $GITHUB_OUTPUT
          echo "runner_image=${RUNNER_IMAGE}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          
          echo "✅ All inputs validated successfully"
          echo "  Min runners: ${MIN_RUNNERS}"
          echo "  Max runners: ${MAX_RUNNERS}"
          echo "  Namespace: ${NAMESPACE}"
          echo "  Runner image: ${RUNNER_IMAGE}"

  trust-boundary:
    name: Prepare Private Runner Trust Boundary
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reconcile trusted runner group
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          # GitHub runner-group endpoint used by the verifier:
          # orgs/redducklabs/actions/runner-groups
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Error: RUNNER_TOKEN secret is not set"
            exit 1
          fi
          bash scripts/verify-runner-trust-boundary.sh \
            --expected-sha "${{ github.event.inputs.expected_sha }}"

  deploy:
    name: Deploy Self-Hosted Runners
    runs-on: ubuntu-latest
    needs: [validate-inputs, trust-boundary]
    if: needs.validate-inputs.outputs.operation != 'prepare-trust-boundary'
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'
      
      - name: Validate GitHub Token
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          echo "🔐 Validating GitHub token permissions..."
          
          # Check if RUNNER_TOKEN secret is set
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Error: RUNNER_TOKEN secret is not set!"
            echo "Please add RUNNER_TOKEN secret with 'admin:org' and 'repo' scopes"
            exit 1
          fi
          
          # Validate token permissions with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Validating token..."
            if gh api user >/dev/null 2>&1; then
              echo "✅ GitHub token validated successfully"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: RUNNER_TOKEN is invalid, expired, or lacks API access"
              exit 1
            else
              echo "⚠️ Token validation failed, retrying in 5s..."
              sleep 5
            fi
          done
      
      - name: Configure DigitalOcean access
        run: |
          echo "🔧 Configuring DigitalOcean access..."
          
          # Validate DO_TOKEN
          if [ -z "${{ secrets.DO_TOKEN }}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi
          
          # Initialize doctl with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${{ secrets.DO_TOKEN }}"; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          # Configure kubectl with retry logic.
          # `kubeconfig save` takes the cluster NAME; `use-context` takes the
          # generated CONTEXT name (do-<region>-<cluster-name>) — these differ.
          echo "Configuring kubectl for cluster ${CLUSTER_NAME} (context ${CLUSTER_CONTEXT})..."
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring kubectl..."
            if doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"; then
              kubectl config use-context "${CLUSTER_CONTEXT}"
              echo "✅ Kubernetes access configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to configure kubectl"
              exit 1
            else
              echo "⚠️ kubectl configuration failed, retrying in 5s..."
              sleep 5
            fi
          done
      
      - name: Check node pool capacity
        run: |
          echo "📐 Checking node pool capacity against requested runner count..."
          MAX_RUNNERS="${{ needs.validate-inputs.outputs.max_runners }}"
          MIN_RUNNERS="${{ needs.validate-inputs.outputs.min_runners }}"
          POOL_NAME="github-runners-pool-16g"

          PODS_PER_NODE=2
          REQUIRED_POOL_MIN=2
          REQUIRED_POOL_MAX=2
          CLUSTER_ID=$(doctl kubernetes cluster list -o json 2>/dev/null \
            | jq -r --arg n "${CLUSTER_NAME}" '.[] | select(.name==$n) | .id')

          if [ -z "${CLUSTER_ID}" ] || [ "${CLUSTER_ID}" = "null" ]; then
            echo "❌ Error: could not resolve cluster '${CLUSTER_NAME}' for capacity validation"
            exit 1
          fi

          POOL_JSON=$(doctl kubernetes cluster node-pool list "${CLUSTER_ID}" -o json 2>/dev/null \
            | jq -r --arg p "${POOL_NAME}" '.[] | select(.name==$p)')

          if [ -z "${POOL_JSON}" ]; then
            echo "❌ Error: node pool '${POOL_NAME}' not found"
            exit 1
          fi

          POOL_MIN=$(echo "${POOL_JSON}" | jq -r '.min_nodes')
          POOL_MAX=$(echo "${POOL_JSON}" | jq -r '.max_nodes')
          POOL_COUNT=$(echo "${POOL_JSON}" | jq -r '.count')
          POOL_AUTOSCALE=$(echo "${POOL_JSON}" | jq -r '.auto_scale')

          REQUIRED_NODES=$(( (MAX_RUNNERS + PODS_PER_NODE - 1) / PODS_PER_NODE ))
          echo "  Node pool: min_nodes=${POOL_MIN} max_nodes=${POOL_MAX} count=${POOL_COUNT} auto_scale=${POOL_AUTOSCALE}"
          echo "  Requested: minRunners=${MIN_RUNNERS} maxRunners=${MAX_RUNNERS}"
          echo "  Capacity: ${PODS_PER_NODE} pods/node; maxRunners requires ${REQUIRED_NODES} nodes"

          if [ "${POOL_MIN}" != "${REQUIRED_POOL_MIN}" ] \
             || [ "${POOL_MAX}" != "${REQUIRED_POOL_MAX}" ] \
             || [ "${POOL_COUNT}" != "2" ] \
             || [ "${POOL_AUTOSCALE}" != "true" ]; then
            echo "❌ Error: runner pool must be auto-scaling at min/max/count 2/2/2; found ${POOL_MIN}/${POOL_MAX}/${POOL_COUNT} auto_scale=${POOL_AUTOSCALE}"
            exit 1
          fi
          if [ "${REQUIRED_NODES}" -gt "${POOL_MAX}" ]; then
            echo "❌ Error: maxRunners (${MAX_RUNNERS}) exceeds ${POOL_MAX} nodes at ${PODS_PER_NODE} pods per node"
            exit 1
          fi
          RUNNER_NODES=$(kubectl get nodes -l node-type=github-runner -o json)
          READY_NODES=$(jq '[.items[] | select(any(.status.conditions[]?; .type=="Ready" and .status=="True"))] | length' <<<"${RUNNER_NODES}")
          TOTAL_NODES=$(jq '.items | length' <<<"${RUNNER_NODES}")
          if [ "${TOTAL_NODES}" != "2" ] || [ "${READY_NODES}" != "2" ]; then
            echo "❌ Error: expected exactly two Ready runner nodes; found ${READY_NODES}/${TOTAL_NODES} Ready"
            exit 1
          fi
          echo "✅ Node pool capacity matches the fixed two-node ceiling"

      - name: Render and preflight candidate
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "🔬 Rendering and validating the exact deployment candidate..."
          NAMESPACE="${{ needs.validate-inputs.outputs.namespace }}"
          MIN_RUNNERS="${{ needs.validate-inputs.outputs.min_runners }}"
          MAX_RUNNERS="${{ needs.validate-inputs.outputs.max_runners }}"
          RUNNER_IMAGE="${{ needs.validate-inputs.outputs.runner_image }}"
          CANDIDATE="${RUNNER_TEMP}/runner-candidate.yaml"
          ASRS="${RUNNER_TEMP}/runner-candidate-asrs.yaml"
          ADMITTED_ASRS="${RUNNER_TEMP}/runner-admitted-asrs.json"
          REPRESENTATIVE_POD="${RUNNER_TEMP}/runner-representative-pod.json"
          ADMITTED_POD="${RUNNER_TEMP}/runner-admitted-pod.json"
          NODES_JSON="${RUNNER_TEMP}/runner-nodes.json"
          PODS_JSON="${RUNNER_TEMP}/all-pods.json"
          umask 077

          helm template "${RELEASE_NAME}" \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            --namespace "${NAMESPACE}" \
            --values deploy/dind-values.yaml \
            --set githubConfigSecret.github_token="${{ secrets.RUNNER_TOKEN }}" \
            --set runnerScaleSetName="${RUNNER_SCALE_SET_NAME}" \
            --set minRunners="${MIN_RUNNERS}" \
            --set maxRunners="${MAX_RUNNERS}" \
            --set-string "template.spec.containers[0].image=${RUNNER_IMAGE}" \
            --set runnerGroup=redducklabs-private-runners \
            --version "${ARC_CHART_VERSION}" > "${CANDIDATE}"

          python3 - "${CANDIDATE}" "${ASRS}" <<'PY'
          import sys
          import yaml

          source, target = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              matches = [doc for doc in yaml.safe_load_all(stream)
                         if isinstance(doc, dict) and doc.get("kind") == "AutoscalingRunnerSet"]
          if len(matches) != 1:
              raise SystemExit(f"expected one AutoscalingRunnerSet, found {len(matches)}")
          with open(target, "w", encoding="utf-8") as stream:
              yaml.safe_dump(matches[0], stream, sort_keys=False)
          PY

          kubectl apply --server-side --dry-run=server -f "${ASRS}" -o json > "${ADMITTED_ASRS}"

          python3 - "${ADMITTED_ASRS}" "${REPRESENTATIVE_POD}" "${NAMESPACE}" <<'PY'
          import json
          import sys

          source, target, namespace = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              asrs = json.load(stream)
          pod = {
              "apiVersion": "v1",
              "kind": "Pod",
              "metadata": {
                  "name": "runner-compatibility-preflight",
                  "namespace": namespace,
                  "labels": {"actions.github.com/scale-set-name": "redducklabs-runners"},
              },
              "spec": asrs["spec"]["template"]["spec"],
          }
          with open(target, "w", encoding="utf-8") as stream:
              json.dump(pod, stream)
          PY

          kubectl apply --server-side --dry-run=server -f "${REPRESENTATIVE_POD}" -o json > "${ADMITTED_POD}"

          python3 - "${ADMITTED_ASRS}" "${ADMITTED_POD}" <<'PY'
          import json
          import sys

          def load(path):
              with open(path, encoding="utf-8") as stream:
                  return json.load(stream)

          asrs, pod = map(load, sys.argv[1:])
          specs = [asrs["spec"]["template"]["spec"], pod["spec"]]
          for spec in specs:
              resources = spec.get("resources", {})
              if resources.get("requests") != {"cpu": "3", "memory": "5Gi"}:
                  raise SystemExit("admission changed the pod-level requests")
              if resources.get("limits") != {"memory": "6Gi"}:
                  raise SystemExit("admission changed the pod-level limits")
              containers = list(spec.get("containers", [])) + list(spec.get("initContainers", []))
              by_name = {container.get("name"): container for container in containers}
              for name in ("runner", "dind"):
                  if name not in by_name:
                      raise SystemExit(f"admission removed required container {name}")
                  budget = by_name[name].get("resources") or {}
                  if budget.get("requests") or budget.get("limits"):
                      raise SystemExit(f"admission injected a competing {name} resource budget")
              if by_name["dind"].get("restartPolicy") != "Always":
                  raise SystemExit("admission removed native-sidecar restartPolicy")
          PY

          SERVER_MINOR=$(kubectl version -o json | jq -r '.serverVersion.minor' | sed 's/[^0-9].*$//')
          if ! [[ "${SERVER_MINOR}" =~ ^[0-9]+$ ]] || [ "${SERVER_MINOR}" -lt 36 ]; then
            echo "❌ Error: Kubernetes API server 1.36 or newer is required"
            exit 1
          fi

          kubectl get nodes -l node-type=github-runner -o json > "${NODES_JSON}"
          kubectl get pods -A -o json > "${PODS_JSON}"
          python3 - "${ADMITTED_POD}" "${NODES_JSON}" "${PODS_JSON}" "${RELEASE_NAME}" <<'PY'
          import json
          import re
          import sys

          admitted_path, nodes_path, pods_path, release = sys.argv[1:]
          with open(admitted_path, encoding="utf-8") as stream:
              proposed = json.load(stream)
          with open(nodes_path, encoding="utf-8") as stream:
              nodes = json.load(stream).get("items", [])
          with open(pods_path, encoding="utf-8") as stream:
              pods = json.load(stream).get("items", [])

          def cpu_m(value):
              value = str(value or "0")
              return int(value[:-1]) if value.endswith("m") else int(float(value) * 1000)

          def memory_mi(value):
              value = str(value or "0")
              match = re.fullmatch(r"([0-9.]+)([KMGT]i?|)", value)
              if not match:
                  raise ValueError(f"unsupported memory quantity {value}")
              amount = float(match.group(1))
              unit = match.group(2)
              factors = {"": 1 / 1024 / 1024, "K": 1000 / 1024 / 1024,
                         "Ki": 1 / 1024, "M": 1000**2 / 1024**2, "Mi": 1,
                         "G": 1000**3 / 1024**2, "Gi": 1024,
                         "T": 1000**4 / 1024**2, "Ti": 1024**2}
              return int(amount * factors[unit])

          def requests(pod):
              spec = pod.get("spec", {})
              pod_requests = spec.get("resources", {}).get("requests", {})
              app_cpu = sum(cpu_m(item.get("resources", {}).get("requests", {}).get("cpu"))
                            for item in spec.get("containers", []))
              app_memory = sum(memory_mi(item.get("resources", {}).get("requests", {}).get("memory"))
                               for item in spec.get("containers", []))
              sidecar_cpu = sidecar_memory = 0
              init_peak_cpu = init_peak_memory = 0
              for init in spec.get("initContainers", []):
                  init_cpu = cpu_m(init.get("resources", {}).get("requests", {}).get("cpu"))
                  init_memory = memory_mi(init.get("resources", {}).get("requests", {}).get("memory"))
                  if init.get("restartPolicy") == "Always":
                      sidecar_cpu += init_cpu
                      sidecar_memory += init_memory
                      init_peak_cpu = max(init_peak_cpu, sidecar_cpu)
                      init_peak_memory = max(init_peak_memory, sidecar_memory)
                  else:
                      init_peak_cpu = max(init_peak_cpu, sidecar_cpu + init_cpu)
                      init_peak_memory = max(init_peak_memory, sidecar_memory + init_memory)
              container_cpu = max(app_cpu + sidecar_cpu, init_peak_cpu)
              container_memory = max(app_memory + sidecar_memory, init_peak_memory)
              cpu = max(cpu_m(pod_requests["cpu"]), container_cpu) if "cpu" in pod_requests else container_cpu
              memory = max(memory_mi(pod_requests["memory"]), container_memory) if "memory" in pod_requests else container_memory
              overhead = spec.get("overhead", {})
              return cpu + cpu_m(overhead.get("cpu")), memory + memory_mi(overhead.get("memory"))

          if len(nodes) != 2:
              raise SystemExit(f"expected exactly two eligible runner nodes, found {len(nodes)}")
          proposed_cpu, proposed_memory = requests(proposed)
          if (proposed_cpu, proposed_memory) != (3000, 5120):
              raise SystemExit("admitted representative Pod request changed")

          for node in nodes:
              version = node.get("status", {}).get("nodeInfo", {}).get("kubeletVersion", "")
              match = re.match(r"v?(\d+)\.(\d+)", version)
              if not match or (int(match.group(1)), int(match.group(2))) < (1, 36):
                  raise SystemExit(f"runner node {node.get('metadata', {}).get('name')} is older than Kubernetes 1.36")
              name = node.get("metadata", {}).get("name")
              allocatable = node.get("status", {}).get("allocatable", {})
              alloc_cpu = cpu_m(allocatable.get("cpu"))
              alloc_memory = memory_mi(allocatable.get("memory"))
              system_cpu = 0
              system_memory = 0
              for pod in pods:
                  labels = pod.get("metadata", {}).get("labels", {})
                  if pod.get("spec", {}).get("nodeName") != name:
                      continue
                  if labels.get("actions.github.com/scale-set-name") == release:
                      continue
                  cpu, memory = requests(pod)
                  system_cpu += cpu
                  system_memory += memory
              remaining_cpu = alloc_cpu - system_cpu - (2 * proposed_cpu)
              remaining_memory = alloc_memory - system_memory - (2 * proposed_memory)
              print(f"{name}: non-runner={system_memory}Mi/{system_cpu}m remaining={remaining_memory}Mi/{remaining_cpu}m")
              if remaining_memory < 2048 or remaining_cpu < 1000:
                  raise SystemExit(f"runner node {name} lacks two-pod scheduling headroom")
          PY
          echo "✅ Live API compatibility and per-node headroom preflight passed"

      - name: Rollback runners
        if: needs.validate-inputs.outputs.operation == 'rollback'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          EXPECTED_SHA="${{ github.event.inputs.expected_sha }}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi
          NAMESPACE="${{ needs.validate-inputs.outputs.namespace }}"
          REVISION="${{ needs.validate-inputs.outputs.rollback_revision }}"
          helm rollback "${RELEASE_NAME}" "${REVISION}" \
            --namespace "${NAMESPACE}" --wait --timeout 300s

          RESTORED=$(helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -o json)
          if ! jq -e '
            .minRunners == 2 and .maxRunners == 2
            and .runnerGroup == "redducklabs-private-runners"
            and ([.template.spec.containers[]? | select(.name=="runner")
                  | .resources.requests.memory] == ["5Gi"])
            and ([.template.spec.initContainers[]? | select(.name=="dind")
                  | .resources.requests.memory] == ["5Gi"])
          ' <<<"${RESTORED}" >/dev/null; then
            echo "❌ Error: rollback revision does not restore the isolated 5Gi+5Gi, 2/2 private-group configuration"
            exit 1
          fi
          bash scripts/verify-runner-trust-boundary.sh \
            --expected-sha "${EXPECTED_SHA}" --verify-only
          echo "✅ Rollback restored revision ${REVISION} with the private trust boundary intact"

      - name: Create namespace if not exists
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "📁 Ensuring namespace exists..."
          NAMESPACE="${{ needs.validate-inputs.outputs.namespace }}"
          
          if ! kubectl get namespace "${NAMESPACE}" &>/dev/null; then
            echo "Creating namespace: ${NAMESPACE}"
            kubectl create namespace "${NAMESPACE}"
          else
            echo "Namespace ${NAMESPACE} already exists"
          fi
      
      - name: Configure registry access
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "🔐 Configuring registry access..."
          NAMESPACE="${{ needs.validate-inputs.outputs.namespace }}"
          
          # Check if registry secret exists
          if ! kubectl get secret do-registry-secret -n "${NAMESPACE}" &>/dev/null; then
            echo "Creating registry secret..."
            doctl registry kubernetes-manifest | kubectl apply -n "${NAMESPACE}" -f -
            
            # Wait for secret to be created
            kubectl wait --for=condition=complete \
              --timeout=30s \
              secret/do-registry-secret \
              -n "${NAMESPACE}" || echo "Secret may take time to propagate"
          else
            echo "Registry secret already exists"
          fi
      
      - name: Report current ARC controller state
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "🔍 Checking for Actions Runner Controller..."

          if helm list -n arc-systems 2>/dev/null | grep -q arc; then
            echo "✅ ARC controller release found"
            helm list -n arc-systems || true

            # Check controller health
            if kubectl get pods -n arc-systems -l app.kubernetes.io/name=gha-rs-controller --no-headers | grep -q Running; then
              echo "✅ ARC controller is running"
            else
              echo "⚠️ ARC controller pods may not be ready"
            fi
          else
            echo "⚠️ ARC controller not found - will be installed"
          fi

          echo ""
          echo "Installed CRD generation (drifts from the chart because Helm"
          echo "never updates crds/ on upgrade - the next step reconciles it):"
          kubectl get crd autoscalingrunnersets.actions.github.com \
            -o jsonpath='{.metadata.annotations.controller-gen\.kubebuilder\.io/version}' 2>/dev/null || echo "(CRD not installed yet)"
          echo ""

      - name: Sync ARC CRDs
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "📦 Reconciling ARC CRDs to chart ${ARC_CHART_VERSION}..."

          # WHY THIS STEP EXISTS
          #
          # Helm installs a chart's crds/ directory exactly once, on first
          # install, and NEVER touches it again on `helm upgrade`. That is
          # documented Helm behaviour, not an ARC quirk. So every ARC chart
          # upgrade silently leaves the CRDs at whatever generation they were
          # first installed with, while the controller moves forward. The drift
          # is invisible until a newer controller writes a field the stale CRD
          # schema prunes.
          #
          # WHY --server-side
          #
          # These CRDs are 575 KB - 1.2 MB each (they embed a full PodSpec).
          # Client-side `kubectl apply` stores the whole manifest in the
          # kubectl.kubernetes.io/last-applied-configuration annotation, which
          # is capped at 256 KB, so a plain apply FAILS on them. Server-side
          # apply carries no such annotation. --force-conflicts takes ownership
          # of fields whose current field manager is Helm's.
          CRD_DIR="$(mktemp -d)"
          helm pull \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
            --version "${ARC_CHART_VERSION}" \
            --untar --untardir "${CRD_DIR}"

          CRD_PATH="${CRD_DIR}/gha-runner-scale-set-controller/crds"
          if [ ! -d "${CRD_PATH}" ]; then
            echo "❌ Error: no crds/ directory in chart ${ARC_CHART_VERSION}"
            exit 1
          fi

          echo "CRDs to apply:"
          ls -la "${CRD_PATH}"

          kubectl apply --server-side --force-conflicts -f "${CRD_PATH}"

          echo ""
          echo "✅ CRDs reconciled. Generation now:"
          kubectl get crd autoscalingrunnersets.actions.github.com \
            -o jsonpath='{.metadata.annotations.controller-gen\.kubebuilder\.io/version}'
          echo ""

          rm -rf "${CRD_DIR}"

      - name: Install or upgrade ARC controller
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          ARC_CHART_VERSION="${ARC_CHART_VERSION:-0.14.2}"
          echo "📦 Installing/upgrading Actions Runner Controller to ${ARC_CHART_VERSION}..."

          # `helm upgrade --install` (not bare `helm install` behind an
          # existence check). The previous form only ran when the controller was
          # ABSENT, which made the pinned chart version dead code on any cluster
          # that already had ARC: the repo claimed one version while the cluster
          # ran another, and the controller could never be upgraded through CI.
          # This form is idempotent and expresses the desired end state, so the
          # pin above is the single source of truth.
          #
          # The controller and scale set charts are released as a matched pair;
          # both use ARC_CHART_VERSION so they cannot drift apart.
          kubectl create namespace arc-systems --dry-run=client -o yaml | kubectl apply -f -

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Installing/upgrading ARC controller..."
            if helm upgrade --install arc \
              --namespace arc-systems \
              --create-namespace \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
              --version "${ARC_CHART_VERSION}" \
              --wait \
              --timeout 300s; then

              echo "✅ ARC controller at ${ARC_CHART_VERSION}"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to install/upgrade ARC controller"
              helm status arc -n arc-systems || true
              kubectl get pods -n arc-systems || true
              exit 1
            else
              echo "⚠️ Failed, retrying in 10s..."
              sleep 10
            fi
          done

          echo "⏳ Waiting for controller to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=gha-rs-controller \
            -n arc-systems \
            --timeout=300s

      - name: Deploy runners
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "🚀 Deploying GitHub runners..."
          NAMESPACE="${{ needs.validate-inputs.outputs.namespace }}"

          # Source of truth is the committed deploy/dind-values.yaml (node pool
          # pinning, tolerations, resources, securityContext). Only secrets and
          # the workflow_dispatch inputs are overlaid via --set so the file stays
          # the single place those values are defined.
          MIN_RUNNERS="${{ needs.validate-inputs.outputs.min_runners }}"
          MAX_RUNNERS="${{ needs.validate-inputs.outputs.max_runners }}"
          RUNNER_IMAGE="${{ needs.validate-inputs.outputs.runner_image }}"

          # Deploy with retry logic
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Deploying runners..."
            if helm upgrade --install "${RELEASE_NAME}" \
              oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
              --namespace "${NAMESPACE}" \
              --values deploy/dind-values.yaml \
              --set githubConfigSecret.github_token="${{ secrets.RUNNER_TOKEN }}" \
              --set runnerScaleSetName="${RUNNER_SCALE_SET_NAME}" \
              --set minRunners="${MIN_RUNNERS}" \
              --set maxRunners="${MAX_RUNNERS}" \
              --set-string "template.spec.containers[0].image=${RUNNER_IMAGE}" \
              --set runnerGroup=redducklabs-private-runners \
              --version "${ARC_CHART_VERSION}" \
              --wait \
              --timeout 300s; then

              echo "✅ Runners deployed successfully"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to deploy runners"
              echo "Checking deployment status..."
              helm status "${RELEASE_NAME}" -n "${NAMESPACE}" || true
              kubectl get pods -n "${NAMESPACE}" || true
              exit 1
            else
              echo "⚠️ Deployment failed, retrying in 10s..."
              sleep 10
            fi
          done
      
      - name: Verify deployment
        if: needs.validate-inputs.outputs.operation == 'deploy'
        run: |
          echo "✅ Deployment complete! Checking runner status..."
          NAMESPACE="${{ needs.validate-inputs.outputs.namespace }}"
          
          echo ""
          echo "📊 Runner pods:"
          kubectl get pods -n "${NAMESPACE}" -l actions.github.com/scale-set-name="${RELEASE_NAME}"
          
          echo ""
          echo "📈 Runner scale set:"
          kubectl get runners.actions.github.com -n "${NAMESPACE}" 2>/dev/null || echo "Runner CRDs not yet available"
          
          echo ""
          echo "🎯 To use these runners in your workflows, add:"
          echo "  runs-on: ${RUNNER_SCALE_SET_NAME}"
      
      - name: Check GitHub registration
        if: needs.validate-inputs.outputs.operation == 'deploy'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          echo ""
          echo "🔍 Checking GitHub registration..."
          
          # Extract org from repository owner
          ORG="${{ github.repository_owner }}"
          
          # Check with retry logic
          for attempt in 1 2 3; do
            RESPONSE=$(gh api "orgs/${ORG}/actions/runners" 2>/dev/null)
            
            if [ $? -eq 0 ]; then
              RUNNERS=$(echo "${RESPONSE}" | jq '.total_count // 0' 2>/dev/null)
              if [ "${RUNNERS}" != "null" ] && [ "${RUNNERS}" != "0" ]; then
                echo "✅ Found ${RUNNERS} runner(s) registered with GitHub"
                break
              fi
            fi
            
            if [ "${attempt}" = "3" ]; then
              echo "⚠️ Could not verify GitHub registration (may take a few minutes to appear)"
            else
              echo "Retrying GitHub API check..."
              sleep 5
            fi
          done

      - name: Remove rendered candidate files
        if: always()
        run: |
          rm -f \
            "${RUNNER_TEMP}/runner-candidate.yaml" \
            "${RUNNER_TEMP}/runner-candidate-asrs.yaml" \
            "${RUNNER_TEMP}/runner-admitted-asrs.json" \
            "${RUNNER_TEMP}/runner-representative-pod.json" \
            "${RUNNER_TEMP}/runner-admitted-pod.json" \
            "${RUNNER_TEMP}/runner-nodes.json" \
            "${RUNNER_TEMP}/all-pods.json"
      
      - name: Summary
        if: always()
        run: |
          OPERATION="${{ needs.validate-inputs.outputs.operation }}"
          JOB_STATUS="${{ job.status }}"
          if [ "${JOB_STATUS}" != "success" ]; then
            echo "## ❌ Runner ${OPERATION} failed" >> $GITHUB_STEP_SUMMARY
            echo "Review the failed gate above; no later mutation step was run." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "${OPERATION}" = "rollback" ]; then
            echo "## ✅ Runner rollback complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Revision**: ${{ needs.validate-inputs.outputs.rollback_revision }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Runner Group**: `redducklabs-private-runners`" >> $GITHUB_STEP_SUMMARY
            echo "- **Restored Concurrency**: 2" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Successfully deployed GitHub runners!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Label**: \`${RUNNER_SCALE_SET_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`${{ needs.validate-inputs.outputs.namespace }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Min Runners**: ${{ needs.validate-inputs.outputs.min_runners }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max Runners**: ${{ needs.validate-inputs.outputs.max_runners }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.validate-inputs.outputs.runner_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "Add this to your workflow:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "jobs:" >> $GITHUB_STEP_SUMMARY
          echo "  build:" >> $GITHUB_STEP_SUMMARY
          echo "    runs-on: ${RUNNER_SCALE_SET_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Input validation and sanitization" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Checksum verified tool downloads" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Minimal container security context" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Retry logic for network operations" >> $GITHUB_STEP_SUMMARY
