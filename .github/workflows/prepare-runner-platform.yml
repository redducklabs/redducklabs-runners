name: Prepare Runner Platform

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact commit SHA containing the platform definition'
        required: true
        type: string
      confirm_platform_mutation:
        description: 'Confirm namespace, CRD, controller, and registry-secret reconciliation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}
  ARC_CHART_VERSION: '0.14.2'

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      expected_sha: ${{ steps.validate.outputs.expected_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate platform preparation inputs
        id: validate
        env:
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_CONFIRM: ${{ inputs.confirm_platform_mutation }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${INPUT_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] \
             || [ "${INPUT_EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha must exactly match the checked-out 40-character SHA"
            exit 1
          fi
          if [ "${INPUT_CONFIRM}" != true ]; then
            echo "❌ Error: platform mutation must be explicitly confirmed"
            exit 1
          fi
          echo "expected_sha=${INPUT_EXPECTED_SHA}" >> "${GITHUB_OUTPUT}"

  prepare-platform:
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Revalidate expected SHA
        env:
          EXPECTED_SHA: ${{ needs.validate-inputs.outputs.expected_sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha does not match the platform-preparation checkout"
            exit 1
          fi

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Configure cluster access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set"
            exit 1
          fi
          doctl auth init --access-token "${DO_TOKEN}"
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"

      - name: Prepare namespace and registry access
        run: |
          kubectl create namespace arc-systems --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace arc-runners --dry-run=client -o yaml | kubectl apply -f -
          doctl registry kubernetes-manifest | kubectl apply -n arc-runners -f -
          kubectl create serviceaccount redducklabs-runners-gha-rs-no-permission \
            --namespace arc-runners --dry-run=client -o json \
            | jq '.automountServiceAccountToken = false' \
            | kubectl apply -f -

      - name: Reconcile pinned ARC CRDs
        run: |
          CRD_DIR=$(mktemp -d)
          trap 'rm -rf "${CRD_DIR}"' EXIT
          helm pull \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
            --version "${ARC_CHART_VERSION}" --untar --untardir "${CRD_DIR}"
          CRD_PATH="${CRD_DIR}/gha-runner-scale-set-controller/crds"
          test -d "${CRD_PATH}"
          kubectl apply --server-side --force-conflicts -f "${CRD_PATH}"

      - name: Reconcile pinned ARC controller
        run: |
          helm upgrade --install arc \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
            --namespace arc-systems \
            --version "${ARC_CHART_VERSION}" \
            --wait --timeout 300s
          kubectl wait --for=condition=available deployment \
            -l app.kubernetes.io/name=gha-rs-controller \
            -n arc-systems --timeout=300s
