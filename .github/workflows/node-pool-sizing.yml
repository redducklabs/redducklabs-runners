name: Node Pool Sizing

# Applies the autoscaling bounds of the dedicated GitHub runner node pool.
#
# Why this workflow exists: the runner pool's min/max node bounds used to live
# only in a comment in deploy/dind-values.yaml while the real values were set by
# hand in the DigitalOcean console. That made half the runner capacity design
# unreproducible. This workflow makes the bounds a reviewed, repeatable change.
#
# The runner scale set places exactly TWO runner pods per node (see the resource
# sizing note in deploy/dind-values.yaml). The production pool is therefore a
# fixed two-node ceiling for the scale set's four-runner maximum.
#
#     max_nodes = ceil(maxRunners / 2) = 2
#
# Those assertions are enforced below against deploy/dind-values.yaml, so the
# committed values file stays the source of truth.
#
# See docs/runbooks/node-pool-sizing.md for the operational procedure.

on:
  workflow_dispatch:
    inputs:
      min_nodes:
        description: 'Minimum nodes in the runner pool (warm capacity, always billed)'
        required: true
        default: '2'
        type: string
      max_nodes:
        description: 'Maximum nodes in the runner pool (cost ceiling)'
        required: true
        default: '2'
        type: string
      pool_name:
        description: 'Node pool name'
        required: false
        default: 'github-runners-pool-16g'
        type: string
      apply:
        description: 'Actually apply the change (unchecked = dry run)'
        required: false
        default: false
        type: boolean
      expected_sha:
        description: 'Exact commit SHA to apply'
        required: true
        type: string

env:
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}

permissions:
  contents: read

jobs:
  size-pool:
    name: Apply Node Pool Sizing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Validate inputs against deploy/dind-values.yaml
        id: validate
        env:
          INPUT_MIN_NODES: ${{ inputs.min_nodes }}
          INPUT_MAX_NODES: ${{ inputs.max_nodes }}
          INPUT_POOL_NAME: ${{ inputs.pool_name }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          echo "🔍 Validating node pool sizing inputs..."

          MIN_NODES="${INPUT_MIN_NODES}"
          MAX_NODES="${INPUT_MAX_NODES}"
          POOL_NAME="${INPUT_POOL_NAME}"
          APPLY="${INPUT_APPLY}"

          EXPECTED_SHA="${INPUT_EXPECTED_SHA}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Error: expected_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi

          if ! [[ "${MIN_NODES}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: min_nodes must be a number"
            exit 1
          fi
          if ! [[ "${MAX_NODES}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: max_nodes must be a number"
            exit 1
          fi
          if [ "${MIN_NODES}" -lt 1 ]; then
            echo "❌ Error: min_nodes must be at least 1"
            echo "   DigitalOcean autoscaling pools cannot scale to zero."
            exit 1
          fi
          if [ "${MIN_NODES}" -gt "${MAX_NODES}" ]; then
            echo "❌ Error: min_nodes (${MIN_NODES}) cannot exceed max_nodes (${MAX_NODES})"
            exit 1
          fi
          if ! [[ "${POOL_NAME}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "❌ Error: pool_name must be a valid DNS-1123 label"
            exit 1
          fi
          case "${APPLY}" in true|false) ;; *)
            echo "❌ Error: apply must be true or false"
            exit 1
            ;;
          esac

          # deploy/dind-values.yaml is the source of truth for runner counts.
          MIN_RUNNERS=$(grep -E '^minRunners:' deploy/dind-values.yaml | awk '{print $2}')
          MAX_RUNNERS=$(grep -E '^maxRunners:' deploy/dind-values.yaml | awk '{print $2}')

          if ! [[ "${MIN_RUNNERS}" =~ ^[0-9]+$ ]] || ! [[ "${MAX_RUNNERS}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: could not parse minRunners/maxRunners from deploy/dind-values.yaml"
            exit 1
          fi

          echo "  deploy/dind-values.yaml: minRunners=${MIN_RUNNERS} maxRunners=${MAX_RUNNERS}"
          echo "  requested pool bounds:   min_nodes=${MIN_NODES} max_nodes=${MAX_NODES}"

          PODS_PER_NODE=2
          REQUIRED_MAX_NODES=$(( (MAX_RUNNERS + PODS_PER_NODE - 1) / PODS_PER_NODE ))
          if [ "${MIN_NODES}" != "2" ] || [ "${MAX_NODES}" != "${REQUIRED_MAX_NODES}" ] || [ "${REQUIRED_MAX_NODES}" != "2" ]; then
            echo "❌ Error: runner pool bounds must be exactly min_nodes=2 max_nodes=2"
            echo "   ${MAX_RUNNERS} runners at ${PODS_PER_NODE} pods per node require ${REQUIRED_MAX_NODES} nodes."
            exit 1
          fi

          echo "min_nodes=${MIN_NODES}" >> $GITHUB_OUTPUT
          echo "max_nodes=${MAX_NODES}" >> $GITHUB_OUTPUT
          echo "pool_name=${POOL_NAME}" >> $GITHUB_OUTPUT
          echo "apply=${APPLY}" >> $GITHUB_OUTPUT
          echo "✅ Inputs are consistent with the deployed runner configuration"

      - name: Configure DigitalOcean access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          echo "🔧 Configuring DigitalOcean access..."

          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${DO_TOKEN}"; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"

      - name: Reduce pool maximum without node removal
        id: reduce
        env:
          APPLY: ${{ steps.validate.outputs.apply }}
          POOL_NAME: ${{ steps.validate.outputs.pool_name }}
          MIN_NODES: ${{ steps.validate.outputs.min_nodes }}
          MAX_NODES: ${{ steps.validate.outputs.max_nodes }}
        run: |
          read_pool() {
            doctl kubernetes cluster node-pool list "${CLUSTER_ID}" -o json \
              | jq -c --arg p "${POOL_NAME}" '.[] | select(.name==$p)'
          }

          verify_pool() {
            local state=$1 expected_max=$2 stage=$3
            jq -e --arg expected_max "${expected_max}" '
              .min_nodes == 2 and .count == 2
              and (.max_nodes | tostring) == $expected_max
              and .size == "s-8vcpu-16gb"
              and .auto_scale == true
              and .labels["node-type"] == "github-runner"
              and any(.taints[]?; .key == "github-runner")
            ' <<<"${state}" >/dev/null || {
              echo "❌ Error: ${stage} pool state violates min/count=2/2, max=${expected_max}, size=s-8vcpu-16gb, autoscale, label, or taint"
              return 1
            }
          }

          verify_nodes_and_arc() {
            local nodes pods sets total ready pending desired
            nodes=$(kubectl get nodes -l node-type=github-runner -o json)
            total=$(jq '.items | length' <<<"${nodes}")
            ready=$(jq '[.items[] | select(any(.status.conditions[]?;
              .type == "Ready" and .status == "True"))] | length' <<<"${nodes}")
            [ "${total}" = "2" ] && [ "${ready}" = "2" ] || {
              echo "❌ Error: exactly two Ready runner nodes are required; found ${ready}/${total}"
              return 1
            }
            pods=$(kubectl get pods -n arc-runners \
              -l actions.github.com/scale-set-name=redducklabs-runners -o json)
            pending=$(jq '[.items[] | select(.status.phase == "Pending")] | length' <<<"${pods}")
            sets=$(kubectl get ephemeralrunnersets.actions.github.com -n arc-runners \
              -l actions.github.com/scale-set-name=redducklabs-runners -o json)
            desired=$(jq '[.items[] | (.spec.replicas // 0)] | add // 0' <<<"${sets}")
            [ "${pending}" = "0" ] && [ "${desired}" -le 2 ] || {
              echo "❌ Error: ARC has Pending runners or scale-up demand (pending=${pending}, desired=${desired})"
              return 1
            }
          }

          CLUSTER_ID=$(doctl kubernetes cluster list -o json \
            | jq -r --arg n "${CLUSTER_NAME}" '.[] | select(.name==$n) | .id')
          if [ -z "${CLUSTER_ID}" ] || [ "${CLUSTER_ID}" = "null" ]; then
            echo "❌ Error: cluster '${CLUSTER_NAME}' not found"
            exit 1
          fi
          INITIAL=$(read_pool)
          if [ -z "${INITIAL}" ]; then
            echo "❌ Error: node pool '${POOL_NAME}' not found"
            exit 1
          fi
          CURRENT_MAX=$(jq -r '.max_nodes' <<<"${INITIAL}")
          case "${CURRENT_MAX}" in 8|2) ;; *)
            echo "❌ Error: current max_nodes must be 8 or 2; found ${CURRENT_MAX}"
            exit 1
            ;;
          esac
          verify_pool "${INITIAL}" "${CURRENT_MAX}" "initial"
          verify_nodes_and_arc
          POOL_ID=$(jq -r '.id' <<<"${INITIAL}")
          echo "cur_min=2" >> "${GITHUB_OUTPUT}"
          echo "cur_max=${CURRENT_MAX}" >> "${GITHUB_OUTPUT}"
          echo "cur_size=s-8vcpu-16gb" >> "${GITHUB_OUTPUT}"

          if [ "${APPLY}" != "true" ]; then
            echo "🧪 DRY RUN - validated safe max_nodes ${CURRENT_MAX} to 2 transition"
            exit 0
          fi

          # Close the observation-to-mutation race. Any node, demand, size,
          # autoscaling, or bound drift aborts instead of risking node removal.
          IMMEDIATE=$(read_pool)
          verify_pool "${IMMEDIATE}" "${CURRENT_MAX}" "immediate pre-mutation"
          verify_nodes_and_arc

          if [ "${CURRENT_MAX}" = "8" ]; then
            doctl kubernetes cluster node-pool update "${CLUSTER_ID}" "${POOL_ID}" \
              --max-nodes 2
          fi

          FINAL=$(read_pool)
          verify_pool "${FINAL}" "2" "post-update"
          verify_nodes_and_arc
          echo "✅ Node pool maximum is 2 and no node was removed"

      - name: Summary
        if: always()
        env:
          APPLY: ${{ steps.validate.outputs.apply }}
          POOL_NAME: ${{ steps.validate.outputs.pool_name }}
          MIN_NODES: ${{ steps.validate.outputs.min_nodes }}
          MAX_NODES: ${{ steps.validate.outputs.max_nodes }}
          CUR_MIN: ${{ steps.reduce.outputs.cur_min }}
          CUR_MAX: ${{ steps.reduce.outputs.cur_max }}
          CUR_SIZE: ${{ steps.reduce.outputs.cur_size }}
        run: |
          {
            echo "## Node Pool Sizing"
            echo ""
            if [ "${APPLY}" = "true" ]; then
              echo "**Applied** to pool \`${POOL_NAME}\`"
            else
              echo "**Dry run** - nothing was changed"
            fi
            echo ""
            echo "| | Before | After |"
            echo "|---|---|---|"
            echo "| min_nodes | ${CUR_MIN} | ${MIN_NODES} |"
            echo "| max_nodes | ${CUR_MAX} | ${MAX_NODES} |"
            echo ""
            echo "Node size: \`${CUR_SIZE}\`."
            echo "Cost scales linearly with node count; \`min_nodes\` is the always-billed floor."
            echo "See \`docs/runbooks/node-pool-sizing.md\`."
          } >> $GITHUB_STEP_SUMMARY
