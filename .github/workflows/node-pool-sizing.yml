name: Node Pool Sizing

# Creates, opens, resizes and removes the burst runner node pools and
# configures the cluster autoscaler's priority expander.
#
# Pools (docs/specs/2026-10-26-runner-burst-autoscaling-design.md, "Node pools
# and the aggregate ceiling"):
#   github-runners-pool-16g         s-8vcpu-16gb        baseline, min=max=count=2 (never changed here)
#   github-runners-burst-amd-16g    s-8vcpu-16gb-amd    primary burst, 0..6
#   github-runners-burst-intel-16g  s-8vcpu-16gb-intel  fallback burst, 0..2
# The burst maxima sum to at most 8.
#
# Operations:
#   create-burst        create missing burst pools closed (min=max=count=0);
#                       narrow an open burst pool back to 0/0
#   configure-expander  cluster expanders priority,random and the
#                       kube-system/cluster-autoscaler-priority-expander ConfigMap
#   enable-burst        open the primary to 0/6, then the fallback to 0/2
#   set-burst-maxima    move allowance between the burst pools (lower first)
#   remove-burst        reset the expanders and delete the burst pools
#
# Every run admits the live state through scripts/verify-runner-pool-state.sh
# and takes an identity snapshot; scripts/burst-pools.sh brackets every
# mutation with an exact identity comparison, a fresh admission, and a
# post-mutation comparison that allows only the declared transition. With
# apply unchecked the run is a dry run that prints the planned calls.
#
# See docs/runbooks/node-pool-sizing.md for the operational procedure.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Node Pool Sizing operation'
        required: true
        type: choice
        options:
          - create-burst
          - configure-expander
          - enable-burst
          - set-burst-maxima
          - remove-burst
      primary_max:
        description: 'set-burst-maxima only: github-runners-burst-amd-16g max_nodes (0..6)'
        required: false
        default: ''
        type: string
      fallback_max:
        description: 'set-burst-maxima only: github-runners-burst-intel-16g max_nodes (0..2)'
        required: false
        default: ''
        type: string
      apply:
        description: 'Actually apply the change (unchecked = dry run)'
        required: false
        default: false
        type: boolean
      expected_sha:
        description: 'Exact commit SHA to apply'
        required: true
        type: string

concurrency:
  group: runner-fleet-mutation
  cancel-in-progress: false

env:
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'redducklabs-cluster' }}
  CLUSTER_CONTEXT: ${{ vars.CLUSTER_CONTEXT || 'do-sfo3-redducklabs-cluster' }}

permissions:
  contents: read

jobs:
  size-pools:
    name: Node Pool Sizing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit bash runs every step as "bash --noprofile --norc -eo pipefail",
    # so a failing command inside a pipeline fails the step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup infrastructure tools
        uses: ./.github/actions/setup-tools
        with:
          install-jq: 'true'

      - name: Validate inputs and expected SHA
        id: validate
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PRIMARY_MAX: ${{ inputs.primary_max }}
          INPUT_FALLBACK_MAX: ${{ inputs.fallback_max }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          # The SHA is verified before any other input and before any step
          # that can reach a mutation.
          EXPECTED_SHA="${INPUT_EXPECTED_SHA}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Error: expected_sha must be a 40-character lowercase commit SHA"
            exit 1
          fi
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "❌ Error: expected_sha ${EXPECTED_SHA} does not match checked-out SHA ${ACTUAL_SHA}"
            exit 1
          fi

          case "${INPUT_OPERATION}" in
            create-burst|configure-expander|enable-burst|set-burst-maxima|remove-burst) ;;
            *)
              echo "❌ Error: unknown operation"
              exit 1
              ;;
          esac
          case "${INPUT_APPLY}" in
            true|false) ;;
            *)
              echo "❌ Error: apply must be true or false"
              exit 1
              ;;
          esac
          if [ "${INPUT_OPERATION}" = set-burst-maxima ]; then
            if ! [[ "${INPUT_PRIMARY_MAX}" =~ ^[0-6]$ ]] || ! [[ "${INPUT_FALLBACK_MAX}" =~ ^[0-2]$ ]]; then
              echo "❌ Error: set-burst-maxima needs primary_max in 0..6 and fallback_max in 0..2"
              exit 1
            fi
            if [ $((INPUT_PRIMARY_MAX + INPUT_FALLBACK_MAX)) -gt 8 ]; then
              echo "❌ Error: burst maxima must sum to at most 8"
              exit 1
            fi
          elif [ -n "${INPUT_PRIMARY_MAX}" ] || [ -n "${INPUT_FALLBACK_MAX}" ]; then
            echo "❌ Error: primary_max and fallback_max are only valid for set-burst-maxima"
            exit 1
          fi

          {
            echo "operation=${INPUT_OPERATION}"
            echo "primary_max=${INPUT_PRIMARY_MAX}"
            echo "fallback_max=${INPUT_FALLBACK_MAX}"
            echo "apply=${INPUT_APPLY}"
            echo "expected_sha=${EXPECTED_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "✅ ${INPUT_OPERATION} (apply=${INPUT_APPLY}) at ${ACTUAL_SHA}"

      - name: Configure DigitalOcean access
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          if [ -z "${DO_TOKEN}" ]; then
            echo "❌ Error: DO_TOKEN secret is not set!"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: Configuring doctl..."
            if doctl auth init --access-token "${DO_TOKEN}" > /dev/null; then
              echo "✅ DigitalOcean authentication configured"
              break
            elif [ "${attempt}" = "3" ]; then
              echo "❌ Error: Failed to authenticate with DigitalOcean"
              exit 1
            else
              echo "⚠️ Authentication failed, retrying in 5s..."
              sleep 5
            fi
          done
          doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"
          kubectl config use-context "${CLUSTER_CONTEXT}"
          CURRENT_CONTEXT=$(kubectl config current-context)
          if [ "${CURRENT_CONTEXT}" != "${CLUSTER_CONTEXT}" ]; then
            echo "❌ Error: kubectl context is '${CURRENT_CONTEXT}', expected '${CLUSTER_CONTEXT}'"
            exit 1
          fi
          echo "✅ kubectl context is ${CURRENT_CONTEXT}"

      - name: Admit pool state and record identities
        env:
          OPERATION: ${{ steps.validate.outputs.operation }}
        run: |
          ./scripts/verify-runner-pool-state.sh \
            --cluster-name "${CLUSTER_NAME}" \
            --operation "${OPERATION}" \
            --emit-identities "${RUNNER_TEMP}/pool-identities.json"

      - name: Run burst pool operation
        env:
          OPERATION: ${{ steps.validate.outputs.operation }}
          PRIMARY_MAX: ${{ steps.validate.outputs.primary_max }}
          FALLBACK_MAX: ${{ steps.validate.outputs.fallback_max }}
          APPLY: ${{ steps.validate.outputs.apply }}
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
        run: |
          # The script's exit status must survive the pipe into tee.
          set -o pipefail
          # Re-check the SHA immediately before the step that mutates.
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ]; then
            echo "❌ Error: checked-out SHA changed after validation"
            exit 1
          fi
          ARGS=("${OPERATION}" --cluster-name "${CLUSTER_NAME}")
          if [ "${OPERATION}" = set-burst-maxima ]; then
            ARGS+=(--primary-max "${PRIMARY_MAX}" --fallback-max "${FALLBACK_MAX}")
          fi
          if [ "${APPLY}" = true ]; then
            ARGS+=(--apply --identities "${RUNNER_TEMP}/pool-identities.json")
          fi
          ./scripts/burst-pools.sh "${ARGS[@]}" 2>&1 | tee "${RUNNER_TEMP}/burst-pools.log"

      - name: Summary
        if: always()
        env:
          OPERATION: ${{ steps.validate.outputs.operation }}
          APPLY: ${{ steps.validate.outputs.apply }}
        run: |
          LOG="${RUNNER_TEMP}/burst-pools.log"
          # The single-quoted sed programs emit literal Markdown backticks.
          # shellcheck disable=SC2016
          {
            echo "## Node Pool Sizing"
            echo ""
            if [ -z "${OPERATION}" ]; then
              echo "**Stopped during input or expected_sha validation** - nothing was changed"
            elif [ "${APPLY}" = "true" ]; then
              echo "**Applied** \`${OPERATION}\`"
            else
              echo "**Dry run** \`${OPERATION}\` - nothing was changed"
            fi
            echo ""
            if [ -f "${LOG}" ]; then
              echo "| Pool | Before (min/max) | After (min/max) |"
              echo "|---|---|---|"
              sed -nE 's/^POOL ([a-z0-9-]+): before=([^ ]+) after=([^ ]+)$/| `\1` | \2 | \3 |/p' "${LOG}"
              echo ""
              sed -nE 's/^EXPANDERS: before=([^ ]*) after=([^ ]*)$/Cluster expanders: before `\1`, after `\2`./p' "${LOG}"
              grep -E '^(PLAN|APPLY|NOOP|READBACK):' "${LOG}" | sed 's/^/    /' || true
              sed -nE 's/^RESULT: (.*)$/\n**Result:** \1/p' "${LOG}"
            else
              echo "The burst pool operation did not run."
            fi
            echo ""
            echo "See \`docs/runbooks/node-pool-sizing.md\`."
          } >> "${GITHUB_STEP_SUMMARY}"
